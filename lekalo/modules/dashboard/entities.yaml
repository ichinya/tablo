            "description": "Validated site configuration. Trim outer URL whitespace and retain validated path bytes, including trailing slashes. JSON selectors accept root $, object fields, quoted JSON keys and array indexes, up to 512 bytes. Missing inputs default to HTTP health, operator == and empty paths/expected value. JSON health requires 2xx and a successful scalar predicate; extraction errors are unknown. Version selectors require a nonempty string up to 200 bytes; empty version endpoint disables selector validation and requests. Empty health_path selects the base URL and strict HTTP 200; JSON settings are inactive until a health path is set. Endpoint token input is independent of Git credentials: missing or exactly empty preserves old ciphertext, nonempty printable ASCII bytes 0x21-0x7e up to512 replaces, explicit remove clears, replacement plus remove conflicts. Invalid nonstrings/controls/spaces/nonASCII are rejected without trimming/truncation. Password always renders empty; invalid URL userinfo/query credentials and rejected/sensitive endpoint query fields are not repopulated on422."
