        {
            "id": "dashboard.site",
            "kind": "entity",
            "version": 5,
            "description": "A configured site and its most recent check. Saved URL bytes retain meaningful trailing path slashes; no automatic URL migration. Null state means unknown, and stale checks are visibly marked. GitHub credentials are encrypted at rest and never returned to the UI; preserve key alongside database backups. Shared credentials are referenced by git_token_id; empty version_path disables installed-version requests and comparison. JSON selectors accept root $, object fields, quoted JSON keys and array indexes, up to 512 bytes. Missing inputs default to HTTP health, operator == and empty paths/expected value. JSON health requires 2xx and a successful scalar predicate; extraction errors are unknown. Version selectors require a nonempty string up to 200 bytes; empty version endpoint disables selector validation and requests. Empty health_path checks the base URL with strict HTTP 200, ignoring JSON settings. health_error_code and health_http_status preserve secret-free structured diagnostics; network and invalid responses remain unknown. Schema 4 adds a nonnegative config_revision; every site edit and selected-token rotation increments it, rejecting disable-enable ABA and restored-value edits. Schema5 adds nullable encrypted endpoint_token without changing historical bootstrap-v1; existing rows have no endpoint Authorization. Existing/external AES256-GCM v1 key custody includes endpoint-only and disabled-site ciphertext. endpoint_token is private persistence, while has_endpoint_token is a computed boolean public projection rather than a stored SQL column. Endpoint ciphertext/input/removal and selected token snapshots never enter public views; endpoint fields never enter Git provider/preview carriers. Token/config edits clear results and advance config_revision including ABA, and endpoint snapshot equality participates in atomic result/service-credit settlement.",
