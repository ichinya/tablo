    "schema_version": "0.2.16",
    "definitions": [
        {
            "id": "dashboard",
            "kind": "module",
            "version": 8,
            "description": "One local administrator, guarded accepted history/incidents and one default-OFF encrypted webhook channel. Cohesive prospective checkpoint/three slots/site, bounded observed best-effort delivery after actual accepted transaction. No queue daemon or delivery guarantee. Separate v1 readonly bearer ingress is a deliberately key-free logical SQL read capability; cookie-only token management retains existing Web/vault/session admission. External bearer DTO remains conservative and separate from cookie-session dashboard polling. The automatic saved-state endpoint shares current Volt presentation and session authority without recording human activity; ordinary Web initialization policy still applies. SQLite remains the default with its existing schema10 and path/URI behavior. Explicit MySQL8.4 or MariaDB11.4 selection requires its own validated transport/TLS/role and existing compatible catalog, with no driver/config/service fallback or normal-entry initialization. Credential modes use the shared external32-byte key and installation verifier; API reader and worker-stop stay key-independent. Server settlement keeps one exact-PDO short writer guard, byte/null CAS, history/incident/notification/service-credit atomicity and committed history watermark, with network work outside transactions. Explicit journaled server maintenance and a finite current15-table offline transfer preserve IDs, NULLs, ciphertexts, password/HMAC bytes and allocation floors; partial DDL and post-transfer new writes have no automatic rollback claim. Default native verification remains SQLite-only; explicit selected-engine verification requires real engine identities, passed statuses, nonzero assertions and the existing8s/20s/64 bounds. Private history reports sample availability and UTC response buckets."
        }
    ]
}
