{
    "schema_version": "0.2.16",
    "definitions": [
        {
            "id": "dashboard.list_sites",
            "kind": "query",
            "version": 1,
            "description": "Administrator dashboard, sorted by sort_order then id, with explicit unverified, paused, stale and partial-error states.",
            "reads": [
                "dashboard.site"
            ],
            "returns": {
                "list": {
                    "ref": "dashboard.site"
                }
            }
        },
        {
            "id": "dashboard.list_git_tokens",
            "kind": "query",
            "version": 1,
            "description": "Authenticated settings lists metadata and project usage counts, never plaintext or ciphertext.",
            "reads": [
                "dashboard.git_token",
                "dashboard.site"
            ],
            "returns": {
                "list": {
                    "ref": "dashboard.git_token_metadata"
                }
            }
        },
        {
            "id": "dashboard.get_settings",
            "kind": "query",
            "version": 1,
            "description": "Authenticated settings page obtains committed interval; missing singleton reads as 10 without mutation. Token metadata is obtained separately by list_git_tokens.",
            "reads": [
                "dashboard.installation_settings"
            ],
            "returns": {
                "ref": "dashboard.number"
            }
        },
        {
            "id": "dashboard.read_history",
            "kind": "query",
            "version": 1,
            "description": "Trusted-local read validates positive existing site, calendar-valid canonicalizable half-open [from,to), default50 limit1..100. DESC checked_at,id keyset with integer LIMIT+1, bounded cursor validates scope and retains first-page global MAX(id) ceiling excluding later inserts. Retention/deletion may reduce pages; no durable snapshot/fixed count. No HTTP, Git, key creation, cleanup or transaction between pages.",
            "reads": [
                "dashboard.site",
                "dashboard.check_history"
            ],
            "returns": {
                "ref": "dashboard.history_page"
            }
        },
        {
            "id": "dashboard.read_incidents",
            "kind": "query",
            "version": 1,
            "description": "Authenticated read-only GET, optional positive existing site filter, default50/limit1..100, LIMIT+1, DESC stable opening ID, fixed first-page MAX(id) ceiling. Strict canonical scope-bound cursor cap256; arrays/coercions/overflow/malformed422, missing/deletedsite404. Escaped current names and finite opening reason/status, observed UTC/recovery/interval and uncertainty/pause/stale/current-revision/clock qualifiers. No COUNTall, history replay/rebuild, DB mutation, HTTP or private payload. Recovery/deletion may alter later pages; no snapshot/count guarantee.",
            "reads": [
                "dashboard.incident",
                "dashboard.incident_checkpoint",
                "dashboard.site"
            ],
            "returns": {
                "ref": "dashboard.incident_page"
            }
        },
        {
            "id": "dashboard.get_notifications",
            "kind": "query",
            "version": 1,
            "description": "Presence-only authenticated settings query; no decrypt, DNS or sends.",
            "reads": [
                "dashboard.notification_settings"
            ],
            "returns": {
                "ref": "dashboard.notification_metadata"
            }
        },
        {
            "id": "dashboard.read_notification_status",
            "kind": "query",
            "version": 1,
            "description": "Safe status projection LIMIT50; finite codes, counts/coalescing and observed times, never endpoint/token/name/cipher/payload.",
            "reads": [
                "dashboard.notification_slot"
            ],
            "returns": {
                "list": {
                    "ref": "dashboard.notification_status"
                }
            }
        }
    ]
}
