{
    "schema_version": "0.2.16",
    "definitions": [
        {
            "id": "dashboard.list_sites",
            "kind": "query",
            "version": 2,
            "description": "Administrator dashboard, sorted by sort_order then id, with explicit unverified, paused, stale and partial-error states. Administrator HTTP admission enforces current committed idle policy and fixed12h absolute cap before resource lookup or protected effects; handler-owned human navigation200 and resource-admitted CSRF-valid deliberate forms/manual checks count, including validation422 and successful POST303. Caller headers/query flags never select activity; explicit Automatic handlers only advance observed time. Unlocked network results require the same original session ID/CSRF/auth start/fingerprint and current lifetime before result/notice writes. CLI/worker lifetime remains independent.",
            "reads": [
                "dashboard.site"
            ],
            "returns": {
                "list": {
                    "ref": "dashboard.site"
                }
            }
        },
        {
            "id": "dashboard.list_git_tokens",
            "kind": "query",
            "version": 1,
            "description": "Authenticated settings lists metadata and project usage counts, never plaintext or ciphertext.",
            "reads": [
                "dashboard.git_token",
                "dashboard.site"
            ],
            "returns": {
                "list": {
                    "ref": "dashboard.git_token_metadata"
                }
            }
        },
        {
            "id": "dashboard.get_settings",
            "kind": "query",
            "version": 1,
            "description": "Authenticated settings page obtains committed interval; missing singleton reads as 10 without mutation. Token metadata is obtained separately by list_git_tokens.",
            "reads": [
                "dashboard.installation_settings"
            ],
            "returns": {
                "ref": "dashboard.number"
            }
        },
        {
            "id": "dashboard.read_history",
            "kind": "query",
            "version": 1,
            "description": "Trusted-local read validates positive existing site, calendar-valid canonicalizable half-open [from,to), default50 limit1..100. DESC checked_at,id keyset with integer LIMIT+1, bounded cursor validates scope and retains first-page global MAX(id) ceiling excluding later inserts. Retention/deletion may reduce pages; no durable snapshot/fixed count. No HTTP, Git, key creation, cleanup or transaction between pages.",
            "reads": [
                "dashboard.site",
                "dashboard.check_history"
            ],
            "returns": {
                "ref": "dashboard.history_page"
            }
        },
        {
            "id": "dashboard.read_incidents",
            "kind": "query",
            "version": 2,
            "description": "Authenticated read-only GET, optional positive existing site filter, default50/limit1..100, LIMIT+1, DESC stable opening ID, fixed first-page MAX(id) ceiling. Strict canonical scope-bound cursor cap256; arrays/coercions/overflow/malformed422, missing/deletedsite404. Escaped current names and finite opening reason/status, observed UTC/recovery/interval and uncertainty/pause/stale/current-revision/clock qualifiers. No COUNTall, history replay/rebuild, DB mutation, HTTP or private payload. Recovery/deletion may alter later pages; no snapshot/count guarantee. Administrator HTTP admission enforces current committed idle policy and fixed12h absolute cap before resource lookup or protected effects; handler-owned human navigation200 and resource-admitted CSRF-valid deliberate forms/manual checks count, including validation422 and successful POST303. Caller headers/query flags never select activity; explicit Automatic handlers only advance observed time. Unlocked network results require the same original session ID/CSRF/auth start/fingerprint and current lifetime before result/notice writes. CLI/worker lifetime remains independent.",
            "reads": [
                "dashboard.incident",
                "dashboard.incident_checkpoint",
                "dashboard.site"
            ],
            "returns": {
                "ref": "dashboard.incident_page"
            }
        },
        {
            "id": "dashboard.get_notifications",
            "kind": "query",
            "version": 1,
            "description": "Presence-only authenticated settings query; no decrypt, DNS or sends.",
            "reads": [
                "dashboard.notification_settings"
            ],
            "returns": {
                "ref": "dashboard.notification_metadata"
            }
        },
        {
            "id": "dashboard.read_notification_status",
            "kind": "query",
            "version": 1,
            "description": "Safe status projection LIMIT50 with an explicit bounded truncation probe; authenticated settings GET can filter an integer site ID to reach every site's at most3 retained slots. Finite codes, counts/coalescing and observed times, never endpoint/token/name/cipher/payload. GET performs no outbox/settings mutation or delivery.",
            "reads": [
                "dashboard.notification_slot"
            ],
            "returns": {
                "list": {
                    "ref": "dashboard.notification_status"
                }
            }
        },
        {
            "id": "dashboard.get_idle_timeout",
            "kind": "query",
            "version": 1,
            "description": "Committed administrator idle timeout minutes, default30 without insertion for a missing singleton; stored integer1..720 required. Authenticated admission reads this policy before route/resource/action/network work on every request.",
            "reads": [
                "dashboard.installation_settings"
            ],
            "returns": {
                "ref": "dashboard.number"
            }
        },
        {
            "id": "dashboard.authenticate_read_api",
            "kind": "query",
            "version": 1,
            "description": "Bearer syntax bounds before Composer/DB. Existing no-CREATE connection immediately query_only/current schema and necessary main metadata. Fixed digest hash_equals and current admin binding in one read snapshot; wrong/revoked token401 before resource/method/parameter disclosure. Deliberately key-free capability; existing browser/CLI/worker vault preconditions stay intact. No session/cookie/idle activity, provider, migration/WAL/checkpoint/FK scan/runtime initialization or selected DB writes. Transport inputs are validated by ReadApiRequest and the JSON contract; this pinned query IR has no input key.",
            "reads": [
                "dashboard.read_api_token",
                "dashboard.user"
            ],
            "returns": {
                "ref": "dashboard.flag"
            }
        },
        {
            "id": "dashboard.read_api_sites",
            "kind": "query",
            "version": 1,
            "description": "Authenticated GET /api/v1/sites raw canonical limit1..100 default50 and int64 after_id default0. Explicit bounded byte projection, typed integer binds, numeric main.sites.id ASC primary-key keyset LIMIT+1; no JOIN/COUNT/OFFSET/N+1/provider. Entire DTO validates/encodes before success; fixed finite errors/private no-store/nosniff. Live pages, no snapshot across requests or total count. Transport inputs are validated by ReadApiRequest and the JSON contract; this pinned query IR has no input key.",
            "reads": [
                "dashboard.site"
            ],
            "returns": {
                "ref": "dashboard.api_sites_response"
            }
        },
        {
            "id": "dashboard.read_api_site",
            "kind": "query",
            "version": 1,
            "description": "Authenticated GET /api/v1/sites/{id}; canonical positive int64 string, no query/body, same exact whitelist. Missing404, malformed400, recognized unsupported method405 Allow GET; no HTML/redirect/CORS/JSONP/reflection. SAPI can normalize raw headers and suppress HEAD bodies. Transport inputs are validated by ReadApiRequest and the JSON contract; this pinned query IR has no input key.",
            "reads": [
                "dashboard.site"
            ],
            "returns": {
                "optional": {
                    "ref": "dashboard.api_site_response"
                }
            }
        },
        {
            "id": "dashboard.read_api_token_metadata",
            "kind": "query",
            "version": 1,
            "description": "Cookie-authenticated administrator settings presence/activity/createdUTC only; raw token/hash/binding never reaches metadata.",
            "reads": [
                "dashboard.read_api_token",
                "dashboard.user"
            ],
            "returns": {
                "ref": "dashboard.read_api_token_status"
            }
        }
    ]
}
