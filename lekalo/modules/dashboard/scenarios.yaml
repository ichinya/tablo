{
    "schema_version": "0.2.16",
    "definitions": [
        {
            "id": "dashboard.single_owner",
            "kind": "scenario",
            "version": 1,
            "summary": "First setup creates id=1 only, duplicate setup is refused; password hash verifies and persistent failed-login rate limit denies the sixth attempt.",
            "covers": [
                "dashboard.setup",
                "dashboard.login",
                "dashboard.user"
            ]
        },
        {
            "id": "dashboard.site_lifecycle",
            "kind": "scenario",
            "version": 1,
            "summary": "Normalize GitHub URL, create, order, edit and delete; malformed input never persists; edit clears stale checks and an old in-flight result is refused.",
            "covers": [
                "dashboard.create_site",
                "dashboard.update_site",
                "dashboard.delete_site",
                "dashboard.list_sites"
            ]
        },
        {
            "id": "dashboard.check_outcomes",
            "kind": "scenario",
            "version": 2,
            "summary": "Empty health path checks the base URL with strict HTTP 200 and ignores JSON settings; explicit HTTP endpoints retain 2xx and JSON predicates. HTTP and false predicates are offline. DNS, timeout, refused, SSRF, TLS, size and invalid responses are unknown with persisted secret-free reasons and HTTP status. Manual and CLI checks agree; independent version/Git failures never overwrite valid health. Schema 1 upgrades atomically to 2 without rewriting existing rows.",
            "covers": [
                "dashboard.check_site",
                "dashboard.site"
            ]
        },
        {
            "id": "dashboard.web_access",
            "kind": "scenario",
            "version": 1,
            "summary": "HTTP smoke: setup, login, session rotation, protected routes, CRUD, CSRF rejection, XSS escaping, deletion confirmation, logout and persistent data. Browser smoke on desktop and mobile.",
            "covers": [
                "dashboard.setup",
                "dashboard.login",
                "dashboard.logout",
                "dashboard.create_site",
                "dashboard.update_site",
                "dashboard.delete_site",
                "dashboard.list_sites"
            ]
        },
        {
            "id": "dashboard.github_credentials",
            "kind": "scenario",
            "version": 1,
            "summary": "Repository URL normalization, authenticated branch pagination and slash names; 401/403/404, empty or malformed results and truncation fail. Save validates branch rather than tags. Per-site credentials are encrypted, blank keeps, replacement/removal work, no secrets reflected. Additive migration preserves owner and sites, and in-flight checks cannot overwrite token changes.",
            "covers": [
                "dashboard.list_branches",
                "dashboard.create_site",
                "dashboard.update_site",
                "dashboard.check_site",
                "dashboard.site"
            ]
        },
        {
            "id": "dashboard.reusable_tokens",
            "kind": "scenario",
            "version": 1,
            "summary": "Settings credentials support create, rename, blank preservation, replacement and unused deletion. Only metadata is rendered, unsupported providers and mismatched selections fail, CSRF/login guard all routes. Projects reference credentials; rotation invalidates stored and in-flight checks. Legacy database migration preserves admin, projects and tokens with the existing vault key.",
            "covers": [
                "dashboard.create_git_token",
                "dashboard.update_git_token",
                "dashboard.delete_git_token",
                "dashboard.list_git_tokens",
                "dashboard.git_token",
                "dashboard.create_site",
                "dashboard.update_site",
                "dashboard.list_branches",
                "dashboard.check_site"
            ]
        },
        {
            "id": "dashboard.optional_version",
            "kind": "scenario",
            "version": 1,
            "summary": "Missing or empty version path skips network requests; health and Git data remain available, no fabricated installed version or false attention. Nonempty invalid paths still fail validation; project placeholders are neutral.",
            "covers": [
                "dashboard.create_site",
                "dashboard.update_site",
                "dashboard.check_site",
                "dashboard.list_sites"
            ]
        },
        {
            "id": "dashboard.json_endpoint_checks",
            "kind": "scenario",
            "version": 1,
            "summary": "Round-trip all JSON settings; additive migration retains admin and encrypted tokens with HTTP defaults. Shared bounded selectors support nested objects, arrays, quoted keys and scalar root. All seven operators cover match, mismatch, boundaries, zero, false and empty string. Malformed JSON, missing/null/composite values and invalid numbers are unknown without leaking response bodies. Non-2xx remains offline. Version selector requires a nonempty string, preserves commit aliases and is ignored without endpoint. Field validation works without JavaScript; errors retain escaped input. Each JSON setting invalidates in-flight checks; real HTTP and native CLI persist equivalent states.",
            "covers": [
                "dashboard.create_site",
                "dashboard.update_site",
                "dashboard.check_site",
                "dashboard.site",
                "dashboard.site_input"
            ]
        },
        {
            "id": "dashboard.github_budget",
            "kind": "scenario",
            "version": 1,
            "summary": "Measure 20-site shared/distinct/anonymous and repeated/unique repository matrix through real localhost cURL. Positive rate controls stop relevant requests, preserve successful fields/health and persist maximum eligibility across fresh web/CLI processes. Exact equal tokens share primary eligibility across saved/manual/duplicate handles and previews through private keyed identity; handle eligibility survives rotation. Anonymous and unrelated actual tokens remain isolated; affirmative secondary crosses scopes. 401/plain 403/404 remain access errors even with unusable remaining or Retry-After, which alone never establishes shared secondary; real 429, valid Retry-After, remaining-zero and recognized secondary messages still defer. Redirect 301/302, unconfirmed branch and oversized branch list retain fixed safe operator guidance; malformed/incomplete data remains distinct from permanent configuration advice and transport/5xx. Memo never caches errors; per-handle credential revisions retain load/memo freshness on rotation, removal and reselection; rename retains memo. Schema 2 upgrades atomically to 3 without a WAL dependency. Scheduling deadlines stop new requests and clamp cURL; synchronous DNS can overrun its deadline, then HTTP is not started. No hard resolver or whole-pass wall-clock bound is promised. Authenticated preview initializes a missing private identity key only before reusable/per-site ciphertext or any key-derived cooldown state exists. Established missing keys fail before key creation and HTTP with backup-restoration guidance; corrupt/unreadable keys remain unchanged. Restoring/moving the original key preserves equivalence/decryption. Public connection input/site arrays redact complete key-error trace arguments with PHP 8.2 SensitiveParameter; argument capture stays enabled.",
            "covers": [
                "dashboard.check_site",
                "dashboard.list_branches",
                "dashboard.create_site",
                "dashboard.update_site",
                "dashboard.github_cooldown"
            ]
        },
        {
            "id": "dashboard.periodic_settings",
            "kind": "scenario",
            "version": 1,
            "summary": "Defaults, malformed/overflow/escaping/auth/CSRF/303 and committed values use actual repository and HTTP settings boundary.",
            "covers": [
                "dashboard.get_settings",
                "dashboard.update_settings",
                "dashboard.installation_settings"
            ]
        },
        {
            "id": "dashboard.periodic_execution",
            "kind": "scenario",
            "version": 2,
            "summary": "Real public passes and CLI subprocesses prove finite passes, enabled reload, cadence, shared PDO/key refusal and successor flock after failed finalization. Actual SQLite store/progress/fairness triggers and deferred foreign-key COMMIT failure roll back both result and credit; stale/disabled/deleted/ABA/rotated snapshots earn none.",
            "covers": [
                "dashboard.run_worker_pass",
                "dashboard.site"
            ]
        },
        {
            "id": "dashboard.worker_singleton_stop",
            "kind": "scenario",
            "version": 1,
            "summary": "Actual CLI child exit and contention across source roots/CWD/canonical DB plus distinct DB control, forced exit and cooperative stop.",
            "covers": [
                "dashboard.run_worker_pass",
                "dashboard.request_worker_stop",
                "dashboard.worker_runtime"
            ]
        },
        {
            "id": "dashboard.worker_fairness",
            "kind": "scenario",
            "version": 1,
            "summary": "Actual 21 repositories and one search grant per window pay both search debts with all core work successful; 24 sites under five-request aggregate budget and inverse cooled-core case retain field service across restart.",
            "covers": [
                "dashboard.run_worker_pass",
                "dashboard.worker_progress",
                "dashboard.github_cooldown"
            ]
        },
        {
            "id": "dashboard.worker_stale_generation",
            "kind": "scenario",
            "version": 1,
            "summary": "Generation-bound stale stop and old finish cannot affect successor; config revisions reject ABA and token rotations while rename-only token snapshots remain compatible.",
            "covers": [
                "dashboard.request_worker_stop",
                "dashboard.run_worker_pass",
                "dashboard.update_site",
                "dashboard.update_git_token"
            ]
        },
        {
            "id": "dashboard.history_atomic_settlement",
            "kind": "scenario",
            "version": 1,
            "summary": "Execute actual manual store, public HTTP and one-shot CLI, real worker HTTP barriers and second-process writers. Every config/credential/revision/ABA/disabled/delete stale path has zero append/credit, rename-only is positive. History INSERT/progress/turn/deferred COMMIT refusal, caller BEGIN, contention, implicit rollback/cleanup first-error and connection reuse preserve result/history/credit pairing. Actual 0/4 upgrades, concurrent migration, conflicts/future version/fast path and failed DDL/version/COMMIT preserve predecessor bytes and empty history. Real local malformed/framed/JSON/version/Git failures preserve unknown/partial health and exclude raw markers.",
            "covers": [
                "dashboard.store_check",
                "dashboard.settle_worker_check",
                "dashboard.check_site",
                "dashboard.run_worker_pass",
                "dashboard.check_history"
            ]
        },
        {
            "id": "dashboard.history_read_retention",
            "kind": "scenario",
            "version": 1,
            "summary": "Actual read/prune repository and CLIs prove same-second tie/repeated/late time, two sites/cascade, half-open ranges, bounds/cursor mismatch and ceiling excluding concurrent old insertion. EXPLAIN proves exact site/time ordering and cascade index. Prune equality, one cutoff, malformed/empty policy before opening DB, 500x10 cap, same-invocation later-batch refusal/resume and writer/new/old/delete interleavings preserve current state; reads are query-only and no key is recreated. Logical deletion has no shrink/secure erase promise.",
            "covers": [
                "dashboard.read_history",
                "dashboard.prune_history",
                "dashboard.check_history"
            ]
        }
    ]
}
