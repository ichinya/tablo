            "id": "dashboard.setup",
            "kind": "command",
            "version": 1,
            "description": "Create the sole administrator once; enforce password length and confirmation, hash password, then rotate session and CSRF token. Create the sole administrator once; enforce password length and confirmation, hash password, then rotate session and CSRF token. Create the sole administrator once using shared exact 12-72-byte confirmation and NUL validation with PASSWORD_DEFAULT/generated salt. Web binds its session to the hash actually inserted by Auth.setupSession, rotates session/CSRF and keeps initialized setup closed; the void Auth.setup wrapper remains compatible. Application runtime precondition: optional external raw32 key selection is read-only and preflighted before database/session/control/network effects; retained authenticated ciphertext witnesses key identity before migration, with no-witness and no-cipher bounds. Secret selection is configuration, never model input. Live key loss or replacement refuses admission and save without regeneration.",
