        {
            "id": "dashboard.setup",
            "kind": "command",
            "version": 1,
            "description": "Create the sole administrator once; enforce password length and confirmation, hash password, then rotate session and CSRF token. Create the sole administrator once using shared exact 12-72-byte confirmation and NUL validation with PASSWORD_DEFAULT/generated salt. Web binds its session to the hash actually inserted by Auth.setupSession, rotates session/CSRF and keeps initialized setup closed; the void Auth.setup wrapper remains compatible. Application runtime precondition: optional external raw32 key selection is read-only and preflighted before database/session/control/network effects; retained authenticated ciphertext witnesses key identity before migration, with no-witness and no-cipher bounds. Secret selection is configuration, never model input. Live key loss or replacement refuses admission and save without regeneration.",
            "input": [
                {
                    "name": "password",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                },
                {
                    "name": "confirmation",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.user_created"
            ]
        },
        {
            "id": "dashboard.login",
            "kind": "command",
            "version": 2,
            "description": "Resolve canonical transport identity at Web login: default/untrusted peers ignore forwarding; exact trusted peers require a fully valid bounded right-to-left XFF chain and fail before Auth on invalid or all-trusted history. Verify administrator password with the persistent atomic five-failure/900-second limiter; regenerate session id and CSRF token on success. Verify under the existing atomic address throttle (five failures/900 seconds). Auth.loginSession returns an internal domain-separated fingerprint of the exact verified hash or its own committed replacement on rehash; Web binds that snapshot without recapture and rotates session/CSRF. Old snapshots fail at the next protected admission after credential change. Auth.login remains bool-compatible; timeout/cookie policy remains unchanged. Application runtime precondition: optional external raw32 key selection is read-only and preflighted before database/session/control/network effects; retained authenticated ciphertext witnesses key identity before migration, with no-witness and no-cipher bounds. Secret selection is configuration, never model input. Live key loss or replacement refuses admission and save without regeneration.",
            "input": [
                {
                    "name": "password",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                }
            ]
        },
        {
            "id": "dashboard.logout",
            "kind": "command",
            "version": 1,
            "description": "CSRF-protected destruction of the authenticated session. Application runtime precondition: optional external raw32 key selection is read-only and preflighted before database/session/control/network effects; retained authenticated ciphertext witnesses key identity before migration, with no-witness and no-cipher bounds. Secret selection is configuration, never model input. Live key loss or replacement refuses admission and save without regeneration."
        },
        {
            "id": "dashboard.create_site",
            "kind": "command",
            "version": 4,
            "description": "Authenticated CSRF-protected create; normalize GitHub URLs; reject invalid URL, branch, path, mode and sort order. Validate the actual GitHub branch using a supplied or saved token; encrypt token replacement, preserve blank token or explicitly remove it. Validate active bounded JSON paths, health mode, operator and finite numeric expected values; retain submitted values and report field errors. Persist JSON settings; unchanged legacy inputs default to HTTP and automatic version extraction. GitHub uses serial REST, safe typed access/rate/unavailable/budget/rotation failures and no retry/sleep. Primary core/search eligibility is stable-handle scoped; secondary is installation-shared and persisted across CLI/web. A 256-entry sweep-local semantic memo is isolated by credential revision and metric/branch; no-release requires repository access confirmation. Monitoring: five attempts/24s per site; branches: eleven attempts; connection: 100 attempts/120s scheduling budget. cURL is clamped; synchronous DNS can overrun and is checked before HTTP. Preserve partial metrics; reject credentials changed before/after load or cache hits. Authenticated preview initializes a missing private identity key only before reusable/per-site ciphertext or any key-derived cooldown state exists. Established missing keys fail before key creation and HTTP with backup-restoration guidance; corrupt/unreadable keys remain unchanged. Restoring/moving the original key preserves equivalence/decryption. Public connection input/site arrays redact complete key-error trace arguments with PHP 8.2 SensitiveParameter; argument capture stays enabled. External raw32 key preflight and lifetime custody are runtime preconditions; see external_key_custody scenario. Endpoint Bearer custody/blank keep/remove: endpoint_credentials scenario.",
            "input": [
                {
                    "name": "site",
                    "type": {
                        "ref": "dashboard.site_input"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_created",
                "dashboard.github_cooldown_created",
                "dashboard.github_cooldown_updated"
            ]
        },
        {
            "id": "dashboard.update_site",
            "kind": "command",
            "version": 5,
            "description": "Authenticated CSRF-protected update; clear obsolete check state on configuration change. Validate the actual GitHub branch using a supplied or saved token; encrypt token replacement, preserve blank token or explicitly remove it. Validate active bounded JSON paths, health mode, operator and finite numeric expected values; retain submitted values and report field errors. Persist JSON settings; unchanged legacy inputs default to HTTP and automatic version extraction. GitHub uses serial REST, safe typed access/rate/unavailable/budget/rotation failures and no retry/sleep. Primary core/search eligibility is stable-handle scoped; secondary is installation-shared and persisted across CLI/web. A 256-entry sweep-local semantic memo is isolated by credential revision and metric/branch; no-release requires repository access confirmation. Monitoring: five attempts/24s per site; branches: eleven attempts; connection: 100 attempts/120s scheduling budget. cURL is clamped; synchronous DNS can overrun and is checked before HTTP. Preserve partial metrics; reject credentials changed before/after load or cache hits. Authenticated preview initializes a missing private identity key only before reusable/per-site ciphertext or any key-derived cooldown state exists. Established missing keys fail before key creation and HTTP with backup-restoration guidance; corrupt/unreadable keys remain unchanged. Restoring/moving the original key preserves equivalence/decryption. Public connection input/site arrays redact complete key-error trace arguments with PHP 8.2 SensitiveParameter; argument capture stays enabled. Configuration revision rejects intervening edits and disable-enable ABA; saved-token rotation increments referenced revisions atomically, rename-only blank-token edit preserves snapshots. External raw32 key preflight and lifetime custody are runtime preconditions; see external_key_custody scenario. Endpoint Bearer custody/blank keep/remove: endpoint_credentials scenario.",
            "input": [
                {
                    "name": "id",
