        {
            "id": "dashboard.check_site",
            "kind": "command",
            "version": 6,
            "description": "Manual, CLI and worker checks preserve health/version and four independent Git fields with partial/null results and storage whitelists. Empty health requests exact saved URL with strict200/no-follow and inactive JSON; explicit paths join rtrim(base, /) with local path/query bytes. Explicit health/nonempty version permit only GET 301/302/303/307/308 with <=3 same-origin transitions/4 requests; canonical scheme/host/effective port excludes CNAME equivalence/downgrade. Public mode: fresh all-answer conservative IANA unicast checks and exact selected-address pin per hop. Explicit allowPrivate: native OS/cURL resolution including hosts/localhost on fresh handles. TLS verification enabled; proxy and auto-follow disabled. URI syntax/origin/cycle/limit fail before dereference, with missing/duplicate/malformed Location or userinfo/fragments rejected; no arbitrary caller headers or raw diagnostic secrets. One monotonic6s endpoint deadline clamped to outer budget; cumulative1MiB header+decoded-body/64KiB header quotas include interim/trailers, exclude chunk/TLS framing. DNS may overrun; no subsequent transfer after expiry. Fixed redirect failures Unknown/no intermediate status; final2xx/JSON predicates and version selectors/commit aliases remain. HTTP/false predicate Offline. All configuration/cipher/selected-token snapshots and config_revision reject edits/ABA/rotation/deletion/reselection; blank token rename remains compatible. Git generic no-follow retains5 requests/24s site,100/120s aggregate,256-entry validated memo, resource primary/shared secondary cooldown, exact-token HMAC/current checks before/after load, no sleep/retry/failure cache. Missing vault key fails before HTTP; SensitiveParameter guards and transient worker service metadata/storage omission remain. External key and endpoint Bearer lifetime custody are runtime preconditions; see external_key_custody/endpoint_credentials scenarios.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_updated",
                "dashboard.github_cooldown_created",
                "dashboard.github_cooldown_updated"
            ]
        },
        {
            "id": "dashboard.list_branches",
            "kind": "command",
            "version": 2,
            "description": "Authenticated CSRF-protected POST previews branches from the fixed GitHub API using new, saved or installation credentials. Paginate without silent truncation, bound requests, handle private access errors; never save or return credentials. HTTP success JSON contains repository, default_branch and branches; failure contains error. Selected shared token must exist and match the Git provider. GitHub uses serial REST, safe typed access/rate/unavailable/budget/rotation failures and no retry/sleep. Primary core/search eligibility is stable-handle scoped; secondary is installation-shared and persisted across CLI/web. A 256-entry sweep-local semantic memo is isolated by credential revision and metric/branch; no-release requires repository access confirmation. Monitoring: five attempts/24s per site; branches: eleven attempts; connection: 100 attempts/120s scheduling budget. cURL is clamped; synchronous DNS can overrun and is checked before HTTP. Preserve partial metrics; reject credentials changed before/after load or cache hits. Authenticated preview initializes a missing private identity key only before reusable/per-site ciphertext or any key-derived cooldown state exists. Established missing keys fail before key creation and HTTP with backup-restoration guidance; corrupt/unreadable keys remain unchanged. Restoring/moving the original key preserves equivalence/decryption. Public connection input/site arrays redact complete key-error trace arguments with PHP 8.2 SensitiveParameter; argument capture stays enabled. External raw32 key preflight and lifetime custody are runtime preconditions; see external_key_custody scenario.",
            "input": [
