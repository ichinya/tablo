        {
            "id": "dashboard.update_git_token",
            "kind": "command",
            "version": 2,
            "description": "Authenticated CSRF-protected metadata edit or token replacement. Blank token keeps old ciphertext. Rotation clears associated project checks atomically. Never reflect plaintext. Configuration revision rejects intervening edits and disable-enable ABA; saved-token rotation increments referenced revisions atomically, rename-only blank-token edit preserves snapshots. Authenticated CSRF-protected metadata edit or token replacement. Blank token keeps old ciphertext. Rotation clears associated project checks atomically. Never reflect plaintext. Application runtime precondition: optional external raw32 key selection is read-only and preflighted before database/session/control/network effects; retained authenticated ciphertext witnesses key identity before migration, with no-witness and no-cipher bounds. Secret selection is configuration, never model input. Live key loss or replacement refuses admission and save without regeneration.",
