        },
        {
            "id": "dashboard.create_site",
            "kind": "command",
            "version": 3,
            "description": "Authenticated CSRF-protected create; normalize GitHub URLs; reject invalid URL, branch, path, mode and sort order. Validate the actual GitHub branch using a supplied or saved token; encrypt token replacement, preserve blank token or explicitly remove it. Validate active bounded JSON paths, health mode, operator and finite numeric expected values; retain submitted values and report field errors. Persist JSON settings; unchanged legacy inputs default to HTTP and automatic version extraction. GitHub uses serial REST, safe typed access/rate/unavailable/budget/rotation failures and no retry/sleep. Primary core/search eligibility is stable-handle scoped; secondary is installation-shared and persisted across CLI/web. A 256-entry sweep-local semantic memo is isolated by credential revision and metric/branch; no-release requires repository access confirmation. Monitoring: five attempts/24s per site; branches: eleven attempts; connection: 100 attempts/120s scheduling budget. cURL is clamped; synchronous DNS can overrun and is checked before HTTP. Preserve partial metrics; reject credentials changed before/after load or cache hits. Authenticated preview initializes a missing private identity key only before reusable/per-site ciphertext or any key-derived cooldown state exists. Established missing keys fail before key creation and HTTP with backup-restoration guidance; corrupt/unreadable keys remain unchanged. Restoring/moving the original key preserves equivalence/decryption. Public connection input/site arrays redact complete key-error trace arguments with PHP 8.2 SensitiveParameter; argument capture stays enabled.",
            "input": [
                {
                    "name": "site",
                    "type": {
                        "ref": "dashboard.site_input"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_created",
                "dashboard.github_cooldown_created",
                "dashboard.github_cooldown_updated"
            ]
        },
        {
            "id": "dashboard.update_site",
            "kind": "command",
            "version": 4,
            "description": "Authenticated CSRF-protected update; clear obsolete check state on configuration change. Validate the actual GitHub branch using a supplied or saved token; encrypt token replacement, preserve blank token or explicitly remove it. Validate active bounded JSON paths, health mode, operator and finite numeric expected values; retain submitted values and report field errors. Persist JSON settings; unchanged legacy inputs default to HTTP and automatic version extraction. GitHub uses serial REST, safe typed access/rate/unavailable/budget/rotation failures and no retry/sleep. Primary core/search eligibility is stable-handle scoped; secondary is installation-shared and persisted across CLI/web. A 256-entry sweep-local semantic memo is isolated by credential revision and metric/branch; no-release requires repository access confirmation. Monitoring: five attempts/24s per site; branches: eleven attempts; connection: 100 attempts/120s scheduling budget. cURL is clamped; synchronous DNS can overrun and is checked before HTTP. Preserve partial metrics; reject credentials changed before/after load or cache hits. Authenticated preview initializes a missing private identity key only before reusable/per-site ciphertext or any key-derived cooldown state exists. Established missing keys fail before key creation and HTTP with backup-restoration guidance; corrupt/unreadable keys remain unchanged. Restoring/moving the original key preserves equivalence/decryption. Public connection input/site arrays redact complete key-error trace arguments with PHP 8.2 SensitiveParameter; argument capture stays enabled. Configuration revision rejects intervening edits and disable-enable ABA; saved-token rotation increments referenced revisions atomically, rename-only blank-token edit preserves snapshots.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                },
                {
                    "name": "site",
                    "type": {
                        "ref": "dashboard.site_input"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_updated",
                "dashboard.github_cooldown_created",
                "dashboard.github_cooldown_updated"
            ]
        },
        {
            "id": "dashboard.delete_site",
            "kind": "command",
            "version": 2,
            "description": "Require confirmation page and authenticated CSRF-protected POST. GET does not delete. Deleting a site cascades only its immutable check history.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_deleted",
                "dashboard.check_history_deleted"
            ]
        },
        {
            "id": "dashboard.check_site",
            "kind": "command",
            "version": 5,
            "description": "Manual and one-shot checks keep their default order/output/storage whitelist. Health/version are independent of four GitHub fields and preserve partial/null results. Empty health path checks base URL with HTTP 200; explicit HTTP uses 2xx; JSON health uses validated path/operator and finite values. HTTP/false predicates are offline; transport/DNS/SSRF/TLS/size/invalid data are unknown with typed fixed diagnostics and optional status. Version selector retains root commit aliases. All original configuration/cipher/selected-token predicates plus config_revision reject edits, disable-enable ABA, rotation, deletion and reselection. Saved-token rename-only blank edits remain compatible. GitHub serial REST keeps five requests/24s site and 100 requests/120s aggregate admission budgets, 256-entry validated memo, resource-specific primary plus shared secondary cooldown, exact-token vault HMAC equivalence and current credential checks before/after memo/load. No provider sleep/retry or failure cache. cURL is clamped but synchronous DNS can overrun. Missing established vault key fails before HTTP without replacement; public connection arrays and rate-response boundaries retain SensitiveParameter. Optional worker order returns transient per-field admitted/completed service metadata; result storage whitelists omit it.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_updated",
                "dashboard.github_cooldown_created",
                "dashboard.github_cooldown_updated"
            ]
        },
        {
            "id": "dashboard.list_branches",
            "kind": "command",
            "version": 2,
            "description": "Authenticated CSRF-protected POST previews branches from the fixed GitHub API using new, saved or installation credentials. Paginate without silent truncation, bound requests, handle private access errors; never save or return credentials. HTTP success JSON contains repository, default_branch and branches; failure contains error. Selected shared token must exist and match the Git provider. GitHub uses serial REST, safe typed access/rate/unavailable/budget/rotation failures and no retry/sleep. Primary core/search eligibility is stable-handle scoped; secondary is installation-shared and persisted across CLI/web. A 256-entry sweep-local semantic memo is isolated by credential revision and metric/branch; no-release requires repository access confirmation. Monitoring: five attempts/24s per site; branches: eleven attempts; connection: 100 attempts/120s scheduling budget. cURL is clamped; synchronous DNS can overrun and is checked before HTTP. Preserve partial metrics; reject credentials changed before/after load or cache hits. Authenticated preview initializes a missing private identity key only before reusable/per-site ciphertext or any key-derived cooldown state exists. Established missing keys fail before key creation and HTTP with backup-restoration guidance; corrupt/unreadable keys remain unchanged. Restoring/moving the original key preserves equivalence/decryption. Public connection input/site arrays redact complete key-error trace arguments with PHP 8.2 SensitiveParameter; argument capture stays enabled.",
            "input": [
                {
                    "name": "repository",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                },
                {
                    "name": "github_token",
                    "type": {
                        "optional": {
                            "ref": "dashboard.text"
                        }
                    }
                },
                {
                    "name": "site_id",
                    "type": {
                        "optional": {
                            "ref": "dashboard.number"
                        }
                    }
                },
                {
                    "name": "remove_github_token",
                    "type": {
                        "optional": {
                            "ref": "dashboard.flag"
                        }
                    }
                },
                {
                    "name": "git_token_id",
                    "type": {
                        "optional": {
                            "ref": "dashboard.number"
                        }
                    }
                }
            ],
            "effects": [
                "dashboard.github_cooldown_created",
                "dashboard.github_cooldown_updated"
            ]
        },
