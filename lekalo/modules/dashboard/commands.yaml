            "id": "dashboard.request_worker_stop",
            "kind": "command",
            "version": 1,
            "description": "Portable CLI records stop only for the observed current run generation. Request is not proof of exit; stale requests cannot stop new runs. Normal finally conditionally clears own generation, OS exit releases persistent lock without unlink. Explicit stop opens only an existing compatible control database without create, migration or token-key access, so loss of the key cannot prevent stopping the observed generation.",
            "input": [
