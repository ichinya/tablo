        {
            "id": "dashboard.change_admin_password",
            "kind": "command",
            "version": 1,
            "description": "Existing-installation-only local operator command: canonical opened-file/admin/schema preflight, protected bounded two-line UTF-8 stdin, shared password validation/hash, and raw BEGIN IMMEDIATE conditional update of administrator 1 against its before-input credential snapshot. Re-read current schema/admin, reject stale or same password, require one row and committed success. No create/migrate/delete/admin gap, key access, session-file deletion, public endpoint or rate-limit change; precommit owned failures roll back, uncertain postcommit output is never automatically retried. Token-key selection and key preflight never run for this command, including missing or malformed external files.",
