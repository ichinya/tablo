        {
            "id": "dashboard.update_settings",
            "kind": "command",
            "version": 1,
            "description": "Authenticated CSRF POST validates raw positive decimal minutes without overflow, commits one setting, returns escaped 422 on invalid input or 303 on success. Concurrent writes use last committed value.",
            "input": [
                {
                    "name": "check_interval_minutes",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                }
            ],
            "effects": [
