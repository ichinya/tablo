{
    "schema_version": "0.2.16",
    "definitions": [
        {
            "id": "dashboard.user_created",
            "kind": "effect",
            "version": 1,
            "operation": "create",
            "entity": "dashboard.user"
        },
        {
            "id": "dashboard.site_created",
            "kind": "effect",
            "version": 1,
            "operation": "create",
            "entity": "dashboard.site"
        },
        {
            "id": "dashboard.site_updated",
            "kind": "effect",
            "version": 1,
            "operation": "update",
            "entity": "dashboard.site"
        },
        {
            "id": "dashboard.site_deleted",
            "kind": "effect",
            "version": 1,
            "operation": "delete",
            "entity": "dashboard.site"
        },
        {
            "id": "dashboard.setup",
            "kind": "command",
            "version": 2,
            "description": "Create the sole administrator once using shared exact 12-72-byte confirmation and NUL validation with PASSWORD_DEFAULT/generated salt. Web binds its session to the hash actually inserted by Auth.setupSession, rotates session/CSRF and keeps initialized setup closed; the void Auth.setup wrapper remains compatible.",
            "input": [
                {
                    "name": "password",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                },
                {
                    "name": "confirmation",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.user_created"
            ]
        },
        {
            "id": "dashboard.login",
            "kind": "command",
            "version": 2,
            "description": "Verify under the existing atomic address throttle (five failures/900 seconds). Auth.loginSession returns an internal domain-separated fingerprint of the exact verified hash or its own committed replacement on rehash; Web binds that snapshot without recapture and rotates session/CSRF. Old snapshots fail at the next protected admission after credential change. Auth.login remains bool-compatible; timeout/cookie policy remains unchanged.",
            "input": [
                {
                    "name": "password",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                }
            ]
        },
        {
            "id": "dashboard.logout",
            "kind": "command",
            "version": 1,
            "description": "CSRF-protected destruction of the authenticated session."
        },
        {
            "id": "dashboard.create_site",
            "kind": "command",
            "version": 2,
            "description": "Authenticated CSRF-protected create; normalize GitHub URLs; reject invalid URL, branch, path, mode and sort order. Validate the actual GitHub branch using a supplied or saved token; encrypt token replacement, preserve blank token or explicitly remove it. Validate active bounded JSON paths, health mode, operator and finite numeric expected values; retain submitted values and report field errors. Persist JSON settings; unchanged legacy inputs default to HTTP and automatic version extraction.",
            "input": [
                {
                    "name": "site",
                    "type": {
                        "ref": "dashboard.site_input"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_created"
            ]
        },
        {
            "id": "dashboard.update_site",
            "kind": "command",
            "version": 2,
            "description": "Authenticated CSRF-protected update; clear obsolete check state on configuration change. Validate the actual GitHub branch using a supplied or saved token; encrypt token replacement, preserve blank token or explicitly remove it. Validate active bounded JSON paths, health mode, operator and finite numeric expected values; retain submitted values and report field errors. Persist JSON settings; unchanged legacy inputs default to HTTP and automatic version extraction.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                },
                {
                    "name": "site",
                    "type": {
                        "ref": "dashboard.site_input"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_updated"
            ]
        },
        {
            "id": "dashboard.delete_site",
            "kind": "command",
            "version": 1,
            "description": "Require confirmation page and authenticated CSRF-protected POST. GET does not delete.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_deleted"
            ]
        },
        {
            "id": "dashboard.check_site",
            "kind": "command",
            "version": 3,
            "description": "Skip disabled sites. Bounded HTTP health/version requests and GitHub provider metadata; store only against the unchanged configuration. Preserve partial/unknown outcomes instead of inventing successful data. Empty version_path skips version request without error. Reusable token changes invalidate in-flight results. HTTP health keeps 2xx semantics. JSON health requires 2xx plus ==, !=, contains or a finite numeric >, >=, <, <= comparison. Missing/null/composite/invalid JSON is unknown; a false predicate or non-2xx is offline. Optional version selector extracts a string and retains root commit aliases. All five JSON settings participate in the unchanged-configuration guard. Manual and CLI checks share this logic. Empty health_path selects the unchanged base URL and requires HTTP 200, without parsing HTML as JSON. HTTP failures and false JSON conditions are offline; timeout/refused/DNS/SSRF/TLS/size/invalid responses are unknown with health_error_code, and valid HTTP responses retain health_http_status. Transport errors never expose URLs, headers or response bodies. All health paths use the same error policy.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.site_updated"
            ]
        },
        {
            "id": "dashboard.list_branches",
            "kind": "command",
            "version": 1,
            "description": "Authenticated CSRF-protected POST previews branches from the fixed GitHub API using new, saved or installation credentials. Paginate without silent truncation, bound requests, handle private access errors; never save or return credentials. HTTP success JSON contains repository, default_branch and branches; failure contains error. Selected shared token must exist and match the Git provider.",
            "input": [
                {
                    "name": "repository",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                },
                {
                    "name": "github_token",
                    "type": {
                        "optional": {
                            "ref": "dashboard.text"
                        }
                    }
                },
                {
                    "name": "site_id",
                    "type": {
                        "optional": {
                            "ref": "dashboard.number"
                        }
                    }
                },
                {
                    "name": "remove_github_token",
                    "type": {
                        "optional": {
                            "ref": "dashboard.flag"
                        }
                    }
                },
                {
                    "name": "git_token_id",
                    "type": {
                        "optional": {
                            "ref": "dashboard.number"
                        }
                    }
                }
            ]
        },
        {
            "id": "dashboard.git_token_created",
            "kind": "effect",
            "version": 1,
            "operation": "create",
            "entity": "dashboard.git_token"
        },
        {
            "id": "dashboard.git_token_updated",
            "kind": "effect",
            "version": 1,
            "operation": "update",
            "entity": "dashboard.git_token"
        },
        {
            "id": "dashboard.git_token_deleted",
            "kind": "effect",
            "version": 1,
            "operation": "delete",
            "entity": "dashboard.git_token"
        },
        {
            "id": "dashboard.create_git_token",
            "kind": "command",
            "version": 1,
            "description": "Authenticated CSRF-protected create of a named credential with supported provider and nonempty token; encrypt secret and enforce unique name per provider.",
            "input": [
                {
                    "name": "token",
                    "type": {
                        "ref": "dashboard.git_token_input"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.git_token_created"
            ]
        },
        {
            "id": "dashboard.update_git_token",
            "kind": "command",
            "version": 1,
            "description": "Authenticated CSRF-protected metadata edit or token replacement. Blank token keeps old ciphertext. Rotation clears associated project checks atomically. Never reflect plaintext.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                },
                {
                    "name": "token",
                    "type": {
                        "ref": "dashboard.git_token_input"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.git_token_updated",
                "dashboard.site_updated"
            ]
        },
        {
            "id": "dashboard.delete_git_token",
            "kind": "command",
            "version": 1,
            "description": "Authenticated CSRF-protected confirmed deletion; refuse credentials referenced by projects. GET only confirms.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.git_token_deleted"
            ]
        },
        {
            "id": "dashboard.user_password_updated",
            "kind": "effect",
            "version": 1,
            "operation": "update",
            "entity": "dashboard.user"
        },
        {
            "id": "dashboard.change_admin_password",
            "kind": "command",
            "version": 1,
            "description": "Existing-installation-only local operator command: canonical opened-file/admin/schema preflight, protected bounded two-line UTF-8 stdin, shared password validation/hash, and raw BEGIN IMMEDIATE conditional update of administrator 1 against its before-input credential snapshot. Re-read current schema/admin, reject stale or same password, require one row and committed success. No create/migrate/delete/admin gap, key access, session-file deletion, public endpoint or rate-limit change; precommit owned failures roll back, uncertain postcommit output is never automatically retried.",
            "input": [
                {
                    "name": "password",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                },
                {
                    "name": "confirmation",
                    "type": {
                        "ref": "dashboard.text"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.user_password_updated"
            ]
        }
    ]
}
