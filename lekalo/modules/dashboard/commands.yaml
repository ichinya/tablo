            ]
        },
        {
            "id": "dashboard.update_git_token",
            "kind": "command",
            "version": 2,
            "description": "Authenticated CSRF-protected metadata edit or token replacement. Blank token keeps old ciphertext. Rotation clears associated project checks atomically. Never reflect plaintext. Configuration revision rejects intervening edits and disable-enable ABA; saved-token rotation increments referenced revisions atomically, rename-only blank-token edit preserves snapshots.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                },
                {
                    "name": "token",
                    "type": {
                        "ref": "dashboard.git_token_input"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.git_token_updated",
                "dashboard.site_updated"
            ]
        },
        {
            "id": "dashboard.delete_git_token",
            "kind": "command",
            "version": 1,
            "description": "Authenticated CSRF-protected confirmed deletion; refuse credentials referenced by projects. GET only confirms.",
            "input": [
                {
                    "name": "id",
                    "type": {
                        "ref": "dashboard.number"
                    },
                    "required": true
                }
            ],
            "effects": [
                "dashboard.git_token_deleted"
            ]
        },
