        {
            "id": "dashboard.run_worker_pass",
            "kind": "command",
            "version": 2,
            "description": "One finite serial pass reloads enabled IDs and each current site. Fresh connection/policy retains bounded aggregate admission and cooldowns. Shared PDO or established-key custody failure propagates to the fixed fatal CLI boundary; per-site network/provider and malformed individual ciphertext continue. One short post-network transaction couples guarded current result and admitted resource service credit. Stale or disabled snapshots earn no credit; store/progress/COMMIT failure rolls back both. Lifetime canonical flock releases even when final state cleanup fails. Application runtime precondition: optional external raw32 key selection is read-only and preflighted before database/session/control/network effects; retained authenticated ciphertext witnesses key identity before migration, with no-witness and no-cipher bounds. Secret selection is configuration, never model input. Live key loss or replacement refuses admission and save without regeneration.",
            "input": [
