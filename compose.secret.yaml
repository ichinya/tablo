# Opt in with: docker compose -f compose.yaml -f compose.secret.yaml ...
# TABLO_TOKEN_KEY_SOURCE is a host path to the original raw 32-byte key.
services:
  tablo:
    environment:
      TABLO_TOKEN_KEY_FILE: /run/secrets/tablo_token_key
    secrets:
      - tablo_token_key
  tablo-worker:
    environment:
      TABLO_TOKEN_KEY_FILE: /run/secrets/tablo_token_key
    secrets:
      - tablo_token_key
secrets:
  tablo_token_key:
    file: "${TABLO_TOKEN_KEY_SOURCE:?Set the host path to the original raw key}"
