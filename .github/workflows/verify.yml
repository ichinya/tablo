name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.4', '8.5']
    defaults:
      run:
        shell: pwsh
    env:
      LEKALO_REF: 9510dd0767a56c0ab34b8d3c8ceb2a14db8de825
      COMPOSER_PROCESS_TIMEOUT: '1800'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Qualify Node and check standalone browser controls
        timeout-minutes: 2
        run: |
          $node = (Get-Command node -CommandType Application -ErrorAction Stop).Source
          $binary = Get-Item -LiteralPath $node -ErrorAction Stop
          if ($binary.PSIsContainer -or $binary.Length -le 0) { throw 'Node executable is unavailable' }
          $runtimeText = & $node -p 'JSON.stringify({executable:process.execPath,version:process.version})'
          if ($LASTEXITCODE -ne 0) { throw 'Node runtime qualification failed' }
          $runtime = $runtimeText | ConvertFrom-Json
          $version = $runtime.version
          if ($version -notmatch '^v([0-9]+)\.[0-9]+\.[0-9]+$' -or [int]$Matches[1] -lt 22) { throw 'Node 22 or newer is required for standalone browser control checks' }
          if ((Get-FileHash -LiteralPath $node -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $runtime.executable -Algorithm SHA256).Hash) { throw 'Node command and actual executable differ' }
          Write-Output "Qualified Node: $($runtime.executable) $version"
          Get-FileHash -LiteralPath $runtime.executable -Algorithm SHA256 | Format-List
          $nodeTemp = Join-Path $env:RUNNER_TEMP 'tablo-browser-control-temp'
          New-Item -ItemType Directory -Path $nodeTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $nodeTemp
          $env:TMP = $nodeTemp
          $env:TMPDIR = $nodeTemp
          & $node --check tests/Browser/dashboard-modes.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $node --test --test-concurrency=1 tests/Browser/control-lifecycle.test.mjs
          exit $LASTEXITCODE
      - name: Start dedicated synthetic helper evidence
        env:
          HELPER_MATRIX_OS: ${{ matrix.os }}
          HELPER_MATRIX_PHP: ${{ matrix.php }}
        run: |
          $helperDirectory = Join-Path $env:RUNNER_TEMP 'tablo-helper-diagnostics'
          New-Item -ItemType Directory -Path $helperDirectory -ErrorAction Stop | Out-Null
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = @{ schema = 'tablo/helper-diagnostics/v1'; status = 'NOTRUN unless case-started evidence exists'; utc = [DateTime]::UtcNow.ToString('o'); run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; job = $env:GITHUB_JOB; os = $env:HELPER_MATRIX_OS; php = $env:HELPER_MATRIX_PHP; head = $head; tree = $tree }
          [IO.File]::WriteAllText((Join-Path $helperDirectory 'started.json'), ($manifest | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, fileinfo, iconv, mbstring, openssl, pdo_sqlite, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: |
          composer validate --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          composer install --no-interaction --prefer-dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          composer check-platform-reqs
          exit $LASTEXITCODE
      - name: Qualify actual native Argon2id policy
        run: |
          php tests/fixtures/argon2id-capability.php
          exit $LASTEXITCODE
      - name: Cache pinned Lekalo CLI
        id: lekalo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/lekalo-bin
          key: lekalo-${{ runner.os }}-${{ runner.arch }}-${{ env.LEKALO_REF }}
      - name: Cache pinned Mago release
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/mago
          key: mago-1.54.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/mago-pin.json') }}
      - name: Install and verify pinned Mago
        run: |
          php tools/install-mago.php
          exit $LASTEXITCODE
      - name: Build Lekalo v0.6.4 (CLI 0.6.3)
        if: steps.lekalo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --no-checkout https://github.com/ichinya/lekalo.git .ci/lekalo-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .ci/lekalo-source checkout --detach $env:LEKALO_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p lekalo-cli --manifest-path .ci/lekalo-source/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .ci/lekalo-bin | Out-Null
          $binaryName = if ($IsWindows) { 'lekalo.exe' } else { 'lekalo' }
          Copy-Item -LiteralPath ".ci/lekalo-source/target/release/$binaryName" -Destination ".ci/lekalo-bin/$binaryName"
      - name: Verify lint, static analysis, contracts and Testo suites
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 composer.lock, lekalo.lock, contracts/php-bindings.json, contracts/reviewed-dependencies.json, tools/reviewed-dependency-map.json, tools/mago-pin.json, mago.toml | Format-List
          $binaryName = if ($IsWindows) { 'lekalo.exe' } else { 'lekalo' }
          $env:LEKALO_BIN = Join-Path $PWD ".ci/lekalo-bin/$binaryName"
          $version = & $env:LEKALO_BIN --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne 'lekalo 0.6.3') { throw 'Unexpected Lekalo CLI version' }
          $env:TABLO_TRACE_ISOLATION_REPORT = Join-Path $env:RUNNER_TEMP 'tablo-trace-inner.jsonl'
          $env:TABLO_RESPONSE_PRIVACY_REPORT = Join-Path $env:RUNNER_TEMP 'tablo-response-inner.jsonl'
          $env:TABLO_HELPER_DIAGNOSTICS_DIRECTORY = Join-Path $env:RUNNER_TEMP 'tablo-helper-diagnostics'
          composer verify
          $verifyExit = $LASTEXITCODE
          exit $verifyExit
      - name: Print existing privacy evidence
        if: always()
        run: |
          foreach ($reportName in @('tablo-trace-inner.jsonl', 'tablo-response-inner.jsonl')) {
            $reportPath = Join-Path $env:RUNNER_TEMP $reportName
            if (Test-Path -LiteralPath $reportPath) { Get-Content -LiteralPath $reportPath -ErrorAction Stop }
          }
      - name: Retain synthetic helper diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        with:
          name: helper-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-php-${{ matrix.php }}
          path: ${{ runner.temp }}/tablo-helper-diagnostics
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          archive: true
          retention-days: 7

  linux-fallback-unit:
    name: Linux native transition faults / isolated stubs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile and run one isolated native fault shim
        run: |
          $ErrorActionPreference = 'Stop'
          $unitRoot = Join-Path $env:RUNNER_TEMP 'tablo-linux-fallback-unit'
          $private = Join-Path $unitRoot 'private'
          $source = Join-Path $unitRoot 'source'
          $output = Join-Path $unitRoot 'out'
          New-Item -ItemType Directory -Path $private,$output,(Join-Path $source 'tools') -ErrorAction Stop | Out-Null
          function Invoke-UnitTool([string]$label,[string]$executable,[string[]]$arguments,[int]$seconds) {
            $start = [Diagnostics.ProcessStartInfo]::new($executable)
            $start.UseShellExecute = $false
            $start.WorkingDirectory = $private
            $start.RedirectStandardInput = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.Environment.Clear()
            foreach ($entry in @{ PATH='/usr/local/bin:/usr/bin:/bin'; HOME=$private; DOCKER_CONFIG=$private; LANG='C' }.GetEnumerator()) { $start.Environment[$entry.Key] = $entry.Value }
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $child = [Diagnostics.Process]::new(); $child.StartInfo = $start
            $watch = [Diagnostics.Stopwatch]::StartNew(); $budget = [int64]$seconds * 1000
            $stdout = [IO.MemoryStream]::new(); $stderr = [IO.MemoryStream]::new()
            $outBuffer = [byte[]]::new(4096); $errBuffer = [byte[]]::new(4096)
            $started = $false; $closed = $false; $streams = $false; $expired = $false; $overflow = $false; $killAttempted = $false
            $outDone = $false; $errDone = $false; $outRead = $null; $errRead = $null; $nativeExit = $null; $childId = $null
            $firstFailure = $null; $streamFailure = $null; $killFailure = $null; $disposeFailure = $null; $retentionFailure = $null
            try {
              if (!$child.Start()) { throw 'Unit tool did not start' }
              $started = $true; $childId = $child.Id; $child.StandardInput.Close()
              $outRead = $child.StandardOutput.BaseStream.ReadAsync($outBuffer,0,$outBuffer.Length)
              $errRead = $child.StandardError.BaseStream.ReadAsync($errBuffer,0,$errBuffer.Length)
              while ($watch.ElapsedMilliseconds -lt $budget + 1000) {
                try {
                  if ($outRead -and $outRead.IsCompleted) {
                    $count = $outRead.GetAwaiter().GetResult()
                    if ($count -eq 0) { $outDone=$true; $outRead=$null }
                    else {
                      $remaining = 65536 - $stdout.Length - $stderr.Length
                      if ($count -gt $remaining) { $overflow=$true }
                      $stdout.Write($outBuffer,0,[Math]::Max(0,[Math]::Min($count,$remaining)))
                      $outRead = $child.StandardOutput.BaseStream.ReadAsync($outBuffer,0,$outBuffer.Length)
                    }
                  }
                  if ($errRead -and $errRead.IsCompleted) {
                    $count = $errRead.GetAwaiter().GetResult()
                    if ($count -eq 0) { $errDone=$true; $errRead=$null }
                    else {
                      $remaining = 65536 - $stdout.Length - $stderr.Length
                      if ($count -gt $remaining) { $overflow=$true }
                      $stderr.Write($errBuffer,0,[Math]::Max(0,[Math]::Min($count,$remaining)))
                      $errRead = $child.StandardError.BaseStream.ReadAsync($errBuffer,0,$errBuffer.Length)
                    }
                  }
                } catch { $streamFailure=$_; if ($null -eq $firstFailure) { $firstFailure=$_ }; break }
                $closed = $child.HasExited
                if ($overflow -or $watch.ElapsedMilliseconds -ge $budget) {
                  $expired = $watch.ElapsedMilliseconds -ge $budget
                  if ($null -eq $firstFailure) { $firstFailure = [InvalidOperationException]::new('Unit tool overflow or deadline') }
                  if (!$closed -and !$killAttempted) {
                    $killAttempted=$true
                    try { $child.Kill($true) } catch { $killFailure=$_ }
                  }
                }
                if ($closed -and $outDone -and $errDone) { $streams=$true; break }
                Start-Sleep -Milliseconds 10
              }
            } catch { if ($null -eq $firstFailure) { $firstFailure=$_ } }
            finally {
              if ($started) {
                try {
                  $closed=$child.HasExited
                  if (!$closed) {
                    if (!$killAttempted) { $killAttempted=$true; try { $child.Kill($true) } catch { $killFailure=$_ } }
                    $remainingWait=[int][Math]::Max(0,[Math]::Min(1000,$budget+1000-$watch.ElapsedMilliseconds))
                    $closed=$child.WaitForExit($remainingWait)
                  }
                  if ($closed) { $nativeExit=$child.ExitCode }
                } catch { if ($null -eq $firstFailure) { $firstFailure=$_ } }
              }
              try { $child.Dispose() } catch { $disposeFailure=$_; if ($null -eq $firstFailure) { $firstFailure=$_ } }
            }
            if (!$closed -or !$streams -or $expired -or $overflow -or $nativeExit -ne 0) {
              if ($null -eq $firstFailure) { $firstFailure=[InvalidOperationException]::new('Unit tool failed or closure unknown') }
            }
            $result = $null
            try {
              [IO.File]::WriteAllBytes((Join-Path $private "$label.stdout"),$stdout.ToArray())
              [IO.File]::WriteAllBytes((Join-Path $private "$label.stderr"),$stderr.ToArray())
              $result = [Text.UTF8Encoding]::new($false,$true).GetString($stdout.ToArray())
            } catch { $retentionFailure=$_; if ($null -eq $firstFailure) { $firstFailure=$_ } }
            $stdoutBytes=$stdout.Length; $stderrBytes=$stderr.Length
            try { $stdout.Dispose() } catch { if ($null -eq $disposeFailure) { $disposeFailure=$_ }; if ($null -eq $firstFailure) { $firstFailure=$_ } }
            try { $stderr.Dispose() } catch { if ($null -eq $disposeFailure) { $disposeFailure=$_ }; if ($null -eq $firstFailure) { $firstFailure=$_ } }
            $receipt = @{ label=$label; pid=$childId; nativeExit=$nativeExit; processClosed=$closed; streamsClosed=$streams; expired=$expired; outputOverflow=$overflow; maximumCapturedBytes=65536; stdoutBytes=$stdoutBytes; stderrBytes=$stderrBytes; firstFailure=($null -ne $firstFailure); streamFailure=($null -ne $streamFailure); killAttempted=$killAttempted; killFailure=($null -ne $killFailure); disposeFailure=($null -ne $disposeFailure); retentionFailure=($null -ne $retentionFailure) }
            try { [IO.File]::WriteAllText((Join-Path $private "$label.json"),($receipt | ConvertTo-Json),[Text.UTF8Encoding]::new($false)) }
            catch { if ($null -eq $firstFailure) { $firstFailure=$_ } }
            if ($null -ne $firstFailure) { throw $firstFailure }
            return $result
          }
          $null = Invoke-UnitTool 'unit-modes' '/usr/bin/chmod' @('700','--',$private,$output,$source,(Join-Path $source 'tools')) 8
          $uid = (Invoke-UnitTool 'unit-uid' '/usr/bin/id' @('-u') 8).Trim()
          $gid = (Invoke-UnitTool 'unit-gid' '/usr/bin/id' @('-g') 8).Trim()
          if ($uid -cnotmatch '^[1-9][0-9]*$' -or $gid -cnotmatch '^[1-9][0-9]*$') { throw 'Unit requires explicit unprivileged identity' }
          $selected = @{}
          foreach ($toolName in @('docker','git')) {
            $discovered = (Get-Command $toolName -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            if ($discovered -isnot [string] -or !$discovered.StartsWith('/') -or $discovered -cmatch '[\x00-\x1f\x7f]') { throw 'Unit tool discovery refused' }
            $canonical = (Invoke-UnitTool "unit-resolve-$toolName" '/usr/bin/readlink' @('-f','--',$discovered) 8).Trim()
            $metadata = Get-Item -LiteralPath $canonical -ErrorAction Stop
            if (!$canonical.StartsWith('/') -or $canonical -cmatch '[\x00-\x1f\x7f]' -or $metadata -isnot [IO.FileInfo] -or $metadata.PSIsContainer -or $metadata.LinkType -or ($metadata.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $metadata.FullName -cne $canonical) { throw 'Canonical unit tool refused' }
            $selected[$toolName] = $canonical
          }
          $head = (Invoke-UnitTool 'unit-head' $selected.git @('-C',"$PWD",'rev-parse','HEAD') 8).Trim()
          $tree = (Invoke-UnitTool 'unit-tree' $selected.git @('-C',"$PWD",'rev-parse','HEAD^{tree}') 8).Trim()
          if ($head -cnotmatch '^[0-9a-f]{40}$' -or $tree -cnotmatch '^[0-9a-f]{40}$') { throw 'Unit checkout identity unknown' }
          $sourcePins = @{}
          $toolsDirectory = Get-Item -LiteralPath (Join-Path $PWD 'tools') -ErrorAction Stop
          if ($toolsDirectory.LinkType -or ($toolsDirectory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Linked unit source parent' }
          foreach ($file in @('server-supervisor-linux.c','server-supervisor-linux-fallback-unit.c')) {
            $input = Join-Path $PWD "tools/$file"; $copy = Join-Path $source "tools/$file"
            $metadata = Get-Item -LiteralPath $input -ErrorAction Stop
            if ($metadata -isnot [IO.FileInfo] -or $metadata.LinkType -or ($metadata.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $metadata.Length -gt 131072) { throw 'Unit requires bounded regular public source' }
            $sourcePins[$file] = (Get-FileHash -LiteralPath $input -Algorithm SHA256).Hash.ToLowerInvariant()
            Copy-Item -LiteralPath $input -Destination $copy -ErrorAction Stop
            if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sourcePins[$file]) { throw 'Unit source copy differs' }
          }
          $imageName = 'docker.io/library/php@sha256:6114a2bd4956c50e4db20f08b9377e4fc7e08417b2aa34a44ec7ff52a07996b5'
          # Explicit finite acquisition in this job; no assumption of a warm daemon.
          $null = Invoke-UnitTool 'unit-image-pull' $selected.docker @('pull','--platform=linux/amd64',$imageName) 300
          $image = @(Invoke-UnitTool 'unit-image' $selected.docker @('image','inspect',$imageName) 8 | ConvertFrom-Json)
          $digests = @($image[0].RepoDigests | Where-Object { $_ -cmatch '^(?:docker\.io/)?(?:library/)?php@sha256:6114a2bd4956c50e4db20f08b9377e4fc7e08417b2aa34a44ec7ff52a07996b5$' })
          if ($image.Count -ne 1 -or $digests.Count -lt 1 -or $image[0].Id -cnotmatch '^sha256:[0-9a-f]{64}$' -or $image[0].Os -cne 'linux' -or $image[0].Architecture -cne 'amd64' -or ($null -ne $image[0].Config.Volumes -and @($image[0].Config.Volumes.PSObject.Properties).Count -ne 0)) { throw 'Unit image identity or implicit volume differs' }
          $nonce = [Guid]::NewGuid().ToString('N'); $name = 'tablo-i39-fallback-unit-' + $nonce
          $cidFile = Join-Path $private 'unit.cid'
          $script = @'
          set -eu
          umask 077
          test ! -e /out/unit
          test ! -e /out/unit.stdout
          test ! -e /out/unit.stderr
          test ! -e /out/unit.stage
          cc=$(command -v gcc)
          ld=$(gcc -print-prog-name=ld)
          case "$ld" in /*) ;; *) ld=$(command -v "$ld") ;; esac
          libc=$(gcc -print-file-name=libc.a)
          test -f "$cc"
          test -f "$ld"
          test -f "$libc"
          test "$libc" != libc.a
          sha256sum tools/server-supervisor-linux.c tools/server-supervisor-linux-fallback-unit.c "$cc" "$ld" "$libc" > /out/input-SHA256SUMS
          printf 'COMPILE\n' > /out/unit.stage
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fno-strict-aliasing -fstack-protector-strong -D_FORTIFY_SOURCE=2 -static -Wl,-z,noexecstack -Wl,--build-id=none -o /out/unit tools/server-supervisor-linux-fallback-unit.c
          printf 'RUN\n' > /out/unit.stage
          /out/unit > /out/unit.stdout 2> /out/unit.stderr
          printf 'MARKER\n' > /out/unit.stage
          test "$(cat /out/unit.stdout)" = 'IO_URING_FALLBACK_UNIT_OK 193'
          test ! -s /out/unit.stderr
          printf 'PROVENANCE\n' > /out/unit.stage
          sha256sum /out/unit > /out/unit-SHA256SUMS
          '@
          $create = @('create','--platform=linux/amd64','--pull=never','--name',$name,'--cidfile',$cidFile,'--label',"tablo.issue39.unit.nonce=$nonce",'--network=none','--read-only','--cap-drop=ALL','--security-opt=no-new-privileges','--pids-limit=8','--memory=512m','--cpus=2','--no-healthcheck','--user',"${uid}:${gid}",'--mount',"type=bind,source=$source,target=/src,readonly",'--mount',"type=bind,source=$output,target=/out",'--tmpfs','/tmp:rw,noexec,nosuid,size=64m','--workdir','/src','--entrypoint','/bin/sh',$imageName,'-c',$script)
          $primary = $null; $cleanupFailure = $null; $passed = $false; $cleanupClosed = $false; $provenance = 'UNKNOWN'
          try {
            $id = (Invoke-UnitTool 'unit-create' $selected.docker $create 30).Trim()
            if ($id -cnotmatch '^[0-9a-f]{64}$' -or (Get-Content -LiteralPath $cidFile -Raw).Trim() -cne $id) { throw 'Unit resource ID unknown' }
            $owned = @(Invoke-UnitTool 'unit-before-start' $selected.docker @('container','inspect',$id) 8 | ConvertFrom-Json)
            if ($owned.Count -ne 1 -or $owned[0].Id -cne $id -or $owned[0].Name -cne "/$name" -or $owned[0].Config.Labels.'tablo.issue39.unit.nonce' -cne $nonce -or $owned[0].Image -cne $image[0].Id -or $owned[0].State.Status -cne 'created' -or $owned[0].State.Running -or $owned[0].State.Pid -ne 0 -or $owned[0].State.Error -cne '') { throw 'Unit positive ownership differs' }
            $null = Invoke-UnitTool 'unit-start' $selected.docker @('start','--attach',$id) 180
            $closed = @(Invoke-UnitTool 'unit-exit' $selected.docker @('container','inspect',$id) 8 | ConvertFrom-Json)
            if ($closed.Count -ne 1 -or $closed[0].Id -cne $id -or $closed[0].Name -cne "/$name" -or $closed[0].Config.Labels.'tablo.issue39.unit.nonce' -cne $nonce -or $closed[0].Image -cne $image[0].Id -or $closed[0].State.Running -or $closed[0].State.Pid -ne 0 -or $closed[0].State.Error -cne '' -or $closed[0].State.OOMKilled -or $closed[0].State.Dead -or $closed[0].State.Status -cne 'exited' -or $closed[0].State.ExitCode -ne 0) { throw 'Unit native exit or daemon closure failed' }
            if ((Get-Content -LiteralPath (Join-Path $output 'unit.stdout') -Raw) -cne "IO_URING_FALLBACK_UNIT_OK 193`n" -or (Get-Item -LiteralPath (Join-Path $output 'unit.stderr')).Length -ne 0) { throw 'Unit success marker differs' }
            $hashes = @(Get-Content -LiteralPath (Join-Path $output 'input-SHA256SUMS'))
            $binaryHash = (Get-Content -LiteralPath (Join-Path $output 'unit-SHA256SUMS') -Raw).Trim()
            if ($hashes.Count -ne 5 -or @($hashes | Where-Object { $_ -cnotmatch '^[0-9a-f]{64}  [^\r\n]+$' }).Count -ne 0 -or $binaryHash -cnotmatch '^[0-9a-f]{64}  /out/unit$' -or $hashes[0].Substring(0,64) -cne $sourcePins['server-supervisor-linux.c'] -or $hashes[1].Substring(0,64) -cne $sourcePins['server-supervisor-linux-fallback-unit.c']) { throw 'Unit provenance hashes differ' }
            $provenance = @{ binarySha256=$binaryHash.Substring(0,64); compilerSha256=$hashes[2].Substring(0,64); linkerSha256=$hashes[3].Substring(0,64); libcArchiveSha256=$hashes[4].Substring(0,64); stdoutSha256=(Get-FileHash -LiteralPath (Join-Path $output 'unit.stdout') -Algorithm SHA256).Hash.ToLowerInvariant() }
            $passed = $true
          } catch { $primary = $_ }
          finally {
            try {
              if (!(Test-Path -LiteralPath $cidFile)) { throw 'Unit custody unknown: no saved ID' }
              $cleanupId = (Get-Content -LiteralPath $cidFile -Raw).Trim()
              if ($cleanupId -cnotmatch '^[0-9a-f]{64}$') { throw 'Unit cleanup identity unknown' }
              $owned = @(Invoke-UnitTool 'unit-cleanup-owner' $selected.docker @('container','inspect',$cleanupId) 8 | ConvertFrom-Json)
              if ($owned.Count -ne 1 -or $owned[0].Id -cne $cleanupId -or $owned[0].Name -cne "/$name" -or $owned[0].Config.Labels.'tablo.issue39.unit.nonce' -cne $nonce -or $owned[0].Image -cne $image[0].Id) { throw 'Unit cleanup ownership refused' }
              if ($owned[0].State.Running) { $null = Invoke-UnitTool 'unit-kill' $selected.docker @('container','kill',$cleanupId) 8 }
              $closed = @(Invoke-UnitTool 'unit-cleanup-closed' $selected.docker @('container','inspect',$cleanupId) 8 | ConvertFrom-Json)
              if ($closed.Count -ne 1 -or $closed[0].Id -cne $cleanupId -or $closed[0].Name -cne "/$name" -or $closed[0].Config.Labels.'tablo.issue39.unit.nonce' -cne $nonce -or $closed[0].Image -cne $image[0].Id -or $closed[0].State.Running -or $closed[0].State.Pid -ne 0 -or $closed[0].State.Error -cne '' -or $closed[0].State.Status -cnotin @('created','exited')) { throw 'Unit daemon closure unknown' }
              $null = Invoke-UnitTool 'unit-remove' $selected.docker @('container','rm',$cleanupId) 8
              $cleanupClosed = $true
            } catch { $cleanupFailure = $_ }
            $unitPhase = 'UNKNOWN'
            try {
              $stageItem = Get-Item -LiteralPath (Join-Path $output 'unit.stage') -Force -ErrorAction Stop
              if ($stageItem -is [IO.FileInfo] -and ($stageItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0 -and $stageItem.Length -ge 1 -and $stageItem.Length -le 11) {
                $stageStream = [IO.File]::Open($stageItem.FullName, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
                try {
                  $stageBytes = [byte[]]::new(12)
                  $stageLength = $stageStream.Read($stageBytes, 0, 12)
                  if ($stageLength -ge 1 -and $stageLength -le 11 -and $stageStream.ReadByte() -eq -1) {
                    $stageToken = [Text.Encoding]::ASCII.GetString($stageBytes, 0, $stageLength)
                    if ($stageToken -cin @("COMPILE`n", "RUN`n", "MARKER`n", "PROVENANCE`n")) { $unitPhase = $stageToken.Substring(0, $stageToken.Length - 1) }
                  }
                } finally { $stageStream.Dispose() }
              }
            } catch { <# Absent or malformed diagnostic stays UNKNOWN. #> }
            $passedCases = if ($passed) { 193 } else { 'UNKNOWN' }
            [IO.File]::WriteAllText((Join-Path $unitRoot 'safe-fallback-unit.json'), (@{ schema='tablo/linux-io-uring-fallback-unit/v2'; phase=$unitPhase; head=$head; tree=$tree; passed=$passed; ownedCleanupClosed=$cleanupClosed; requiredCases=193; passedCases=$passedCases; sourceSha256=$sourcePins['server-supervisor-linux.c']; harnessSha256=$sourcePins['server-supervisor-linux-fallback-unit.c']; compilerImageDigest='sha256:6114a2bd4956c50e4db20f08b9377e4fc7e08417b2aa34a44ec7ff52a07996b5'; provenance=$provenance; issueAccepted=$false } | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          }
          if ($null -ne $primary -or $null -ne $cleanupFailure -or !$passed -or !$cleanupClosed) { throw 'Unit failed or custody unknown; dependent native/product work remains NOTRUN' }
      - name: Retain safe isolated unit outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        with:
          name: linux-fallback-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tablo-linux-fallback-unit/safe-fallback-unit.json
          if-no-files-found: warn
          retention-days: 7

  server:
    needs: [linux-fallback-unit]
    name: Ubuntu / ${{ matrix.engine }} / PHP ${{ matrix.php }}${{ matrix.declarationOnly && ' / declaration-only' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
        php: ['8.2', '8.5']
        declarationOnly: [false]
        include:
          - engine: mysql
            php: '8.2'
            declarationOnly: true
    defaults:
      run:
        shell: pwsh
    env:
      LEKALO_REF: 9510dd0767a56c0ab34b8d3c8ceb2a14db8de825
      COMPOSER_PROCESS_TIMEOUT: '1800'
      # Temporary paired diagnostics; neither mode qualifies the original cold memory budget.
      TABLO_TEST_COLD_R77: ${{ github.event_name == 'push' && 'observe' || 'inactive' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Seed safe declaration status before input preparation
        run: |
          $cellDirectory = Join-Path $env:RUNNER_TEMP 'tablo-server-cell'
          New-Item -ItemType Directory -Path $cellDirectory -ErrorAction Stop | Out-Null
          $declaration = @{ schema = 'tablo/server-hosted-declaration/v1'; status = 'NOTRUN_OR_FAILED'; stage = 'WORKFLOW_INPUT_PREPARATION'; type = $null; source = $null; line = $null; nativeExit = $null; executed = $false; head = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; engine = '${{ matrix.engine }}'; php = '${{ matrix.php }}'; declarationOnly = [bool]::Parse('${{ matrix.declarationOnly }}'); issueAccepted = $false }
          if (!$declaration.declarationOnly) {
            $cellNonce = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(16)).ToLowerInvariant()
            $declaration.nonce = $cellNonce
            [IO.File]::AppendAllText($env:GITHUB_ENV, "TABLO_SERVER_CELL_NONCE=$cellNonce`n", [Text.UTF8Encoding]::new($false))
          }
          [IO.File]::WriteAllText((Join-Path $cellDirectory 'safe-declaration.json'), ($declaration | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, fileinfo, iconv, mbstring, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: |
          composer validate --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          composer install --no-interaction --prefer-dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          composer check-platform-reqs
          exit $LASTEXITCODE
      - name: Cache pinned Lekalo CLI
        id: server-lekalo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/lekalo-bin
          key: lekalo-${{ runner.os }}-${{ runner.arch }}-${{ env.LEKALO_REF }}
      - name: Cache pinned Mago release
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/mago
          key: mago-1.54.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/mago-pin.json') }}
      - name: Install and verify pinned Mago
        run: |
          php tools/install-mago.php
          exit $LASTEXITCODE
      - name: Build Lekalo v0.6.4 (CLI 0.6.3)
        if: steps.server-lekalo-cache.outputs.cache-hit != 'true' && !matrix.declarationOnly
        run: |
          git clone --no-checkout https://github.com/ichinya/lekalo.git .ci/lekalo-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .ci/lekalo-source checkout --detach $env:LEKALO_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p lekalo-cli --manifest-path .ci/lekalo-source/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .ci/lekalo-bin | Out-Null
          Copy-Item -LiteralPath .ci/lekalo-source/target/release/lekalo -Destination .ci/lekalo-bin/lekalo
      - name: Require prepared Lekalo for declaration-only diagnostics
        if: matrix.declarationOnly && steps.server-lekalo-cache.outputs.cache-hit != 'true'
        run: |
          throw 'Declaration-only diagnostics require the existing pinned tool cache; no compiler is launched.'
      - name: Prepare exact Node24.13.0 for the opt-in server observer
        run: |
          if ($env:RUNNER_OS -ne 'Linux' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Unqualified server observer platform' }
          $nodeDirectory = Join-Path $env:RUNNER_TEMP 'tablo-server-node-v24.13.0'
          New-Item -ItemType Directory -Path $nodeDirectory -ErrorAction Stop | Out-Null
          $nodeArchive = Join-Path $nodeDirectory 'node-v24.13.0-linux-x64.tar.xz'
          Invoke-WebRequest -Uri 'https://nodejs.org/download/release/v24.13.0/node-v24.13.0-linux-x64.tar.xz' -OutFile $nodeArchive -TimeoutSec 300
          if ((Get-FileHash -LiteralPath $nodeArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e798599612f4bb71333a3397ab0d095fd62214e115aea45aa858a145fc72d67e') { throw 'Pinned Node archive differs' }
          $nodeMember = 'node-v24.13.0-linux-x64/bin/node'
          $nodeListing = @(tar -tvf $nodeArchive $nodeMember)
          if ($LASTEXITCODE -ne 0 -or $nodeListing.Count -ne 1 -or $nodeListing[0] -notmatch '^-.*\snode-v24\.13\.0-linux-x64/bin/node$') { throw 'Pinned Node member is not one regular file' }
          tar --extract --file $nodeArchive --directory $nodeDirectory --no-same-owner --no-same-permissions $nodeMember
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selectedNode = Join-Path $nodeDirectory 'node-v24.13.0-linux-x64/bin/node'
          $nodeFile = Get-Item -LiteralPath $selectedNode -ErrorAction Stop
          if ($nodeFile.PSIsContainer -or $nodeFile.LinkType -or ($nodeFile.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Extracted Node is not regular' }
          $nodeVersion = & $selectedNode --version
          if ($LASTEXITCODE -ne 0 -or $nodeVersion.Trim() -cne 'v24.13.0') { throw 'Pinned Node version differs' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TABLO_TEST_NODE_BIN=$selectedNode`n", [Text.UTF8Encoding]::new($false))
      - name: Select canonical PHP Composer and Docker for both server modes
        run: |
          # BEGIN SHARED SERVER TOOL SELECTION
          foreach ($selection in @(
            @{ Key='TABLO_SERVER_PREPARED_PHP'; Command='php' },
            @{ Key='TABLO_TEST_COMPOSER_PHAR'; Command='composer' },
            @{ Key='TABLO_TEST_DOCKER_BIN'; Command='docker' }
          )) {
            $command = (Get-Command $selection.Command -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            if ($command -isnot [string] -or !$command.StartsWith('/') -or $command -match '[\x00-\x1f\x7f]') { throw 'Selected server command is not an absolute scalar' }
            $canonical = readlink -f -- $command
            if ($LASTEXITCODE -ne 0 -or $canonical -isnot [string] -or !$canonical.StartsWith('/') -or $canonical -match '[\x00-\x1f\x7f]') { throw 'Canonical server tool unavailable' }
            $toolFile = Get-Item -LiteralPath $canonical -ErrorAction Stop
            if ($toolFile -isnot [IO.FileInfo] -or $toolFile.PSIsContainer -or $toolFile.LinkType -or ($toolFile.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $toolFile.FullName -cne $canonical) { throw 'Canonical server tool is not a regular nonlink target' }
            [Environment]::SetEnvironmentVariable($selection.Key, $canonical)
            [IO.File]::AppendAllText($env:GITHUB_ENV, "$($selection.Key)=$canonical`n", [Text.UTF8Encoding]::new($false))
          }
          # END SHARED SERVER TOOL SELECTION
      - name: Select the canonical Linux command shell before qualification
        if: ${{ !matrix.declarationOnly }}
        run: |
          $shellCommand = (Get-Command sh -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $selectedShell = readlink -f -- $shellCommand
          if ($LASTEXITCODE -ne 0 -or $selectedShell -isnot [string] -or !$selectedShell.StartsWith('/')) { throw 'Canonical command shell unavailable' }
          $shellFile = Get-Item -LiteralPath $selectedShell -ErrorAction Stop
          if ($shellFile.PSIsContainer -or $shellFile.LinkType -or ($shellFile.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Canonical command shell is not regular' }
          $shellDigest = (Get-FileHash -LiteralPath $selectedShell -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TABLO_SERVER_LINUX_SHELL=$selectedShell`nTABLO_SERVER_LINUX_SHELL_SHA256=$shellDigest`n", [Text.UTF8Encoding]::new($false))
      - name: Compile the pinned Linux admission helper in an isolated output directory
        if: ${{ !matrix.declarationOnly }}
        timeout-minutes: 12
        run: |
          $cellDirectory = Join-Path $env:RUNNER_TEMP 'tablo-server-cell'
          $privateDirectory = Join-Path $cellDirectory 'compiler-private'
          $outputDirectory = Join-Path $cellDirectory 'compiler-out'
          $compilerSource = Join-Path $cellDirectory 'compiler-source'
          New-Item -ItemType Directory -Path $privateDirectory,$outputDirectory,(Join-Path $compilerSource 'tools') -ErrorAction Stop | Out-Null
          chmod 700 -- $privateDirectory $outputDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('server-supervisor-linux.c','server-supervisor-linux-controls.c','server-supervisor-linux-build.sh')) {
            $inputPath = Join-Path $PWD "tools/$name"
            $copyPath = Join-Path $compilerSource "tools/$name"
            Copy-Item -LiteralPath $inputPath -Destination $copyPath -ErrorAction Stop
            if ((Get-FileHash -LiteralPath $inputPath -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $copyPath -Algorithm SHA256).Hash) { throw 'Compiler source copy differs' }
          }
          function Invoke-FiniteTool([string]$label, [string]$executable, [string[]]$arguments, [int]$seconds) {
            $start = [Diagnostics.ProcessStartInfo]::new($executable)
            $start.UseShellExecute = $false
            $start.RedirectStandardInput = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.WorkingDirectory = $privateDirectory
            $start.Environment.Clear()
            foreach ($entry in @{ PATH='/usr/local/bin:/usr/bin:/bin'; HOME=$privateDirectory; DOCKER_CONFIG=$privateDirectory; LANG='C' }.GetEnumerator()) { $start.Environment[$entry.Key] = $entry.Value }
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $child = [Diagnostics.Process]::new()
            $child.StartInfo = $start
            try {
              if (!$child.Start()) { throw 'Native preparation did not start' }
              $child.StandardInput.Close()
              $stdoutTask = $child.StandardOutput.ReadToEndAsync()
              $stderrTask = $child.StandardError.ReadToEndAsync()
              $closed = $child.WaitForExit($seconds * 1000)
              $expired = !$closed
              if (!$closed) { $child.Kill($true); $closed = $child.WaitForExit(1000) }
              $streamsClosed = $stdoutTask.Wait(1000) -and $stderrTask.Wait(1000)
              $nativeExit = if ($closed) { $child.ExitCode } else { $null }
              $receipt = @{ label=$label; pid=$child.Id; nativeExit=$nativeExit; expired=$expired; processClosed=$closed; streamsClosed=$streamsClosed }
              [IO.File]::WriteAllText((Join-Path $privateDirectory "$label.json"), ($receipt | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
              if (!$streamsClosed) { throw 'Native preparation stream closure unknown' }
              [IO.File]::WriteAllText((Join-Path $privateDirectory "$label.stdout"), $stdoutTask.Result, [Text.UTF8Encoding]::new($false))
              [IO.File]::WriteAllText((Join-Path $privateDirectory "$label.stderr"), $stderrTask.Result, [Text.UTF8Encoding]::new($false))
              if ($expired -or !$closed -or $nativeExit -ne 0) { throw 'Native preparation failed or closure unknown' }
              return $stdoutTask.Result
            } finally { $child.Dispose() }
          }
          $docker = $env:TABLO_TEST_DOCKER_BIN
          $identity = Invoke-FiniteTool 'host-identity' $env:TABLO_TEST_NODE_BIN @('--eval','process.stdout.write(JSON.stringify({uid:process.getuid(),gid:process.getgid()}))') 8 | ConvertFrom-Json
          if ($identity.uid -lt 1 -or $identity.gid -lt 1) { throw 'Explicit unprivileged runner identity required' }
          $compilerImage = 'docker.io/library/php@sha256:6114a2bd4956c50e4db20f08b9377e4fc7e08417b2aa34a44ec7ff52a07996b5'
          $null = Invoke-FiniteTool 'compiler-pull' $docker @('pull','--platform=linux/amd64',$compilerImage) 300
          $image = @(Invoke-FiniteTool 'compiler-image' $docker @('image','inspect',$compilerImage) 8 | ConvertFrom-Json)
          $digestNames = @($image[0].RepoDigests | Where-Object { $_ -cmatch '^(?:docker\.io/)?(?:library/)?php@sha256:6114a2bd4956c50e4db20f08b9377e4fc7e08417b2aa34a44ec7ff52a07996b5$' })
          if ($image.Count -ne 1 -or $digestNames.Count -lt 1 -or $image[0].Id -cnotmatch '^sha256:[0-9a-f]{64}$' -or $image[0].Os -cne 'linux' -or $image[0].Architecture -cne 'amd64' -or ($null -ne $image[0].Config.Volumes -and @($image[0].Config.Volumes.PSObject.Properties).Count -ne 0)) { throw 'Compiler image identity or volume declaration differs' }
          $containerName = 'tablo-i39-compiler-' + $env:TABLO_SERVER_CELL_NONCE
          $cidFile = Join-Path $privateDirectory 'compiler.cid'
          $create = @('create','--platform=linux/amd64','--pull=never','--name',$containerName,'--cidfile',$cidFile,'--label',"tablo.issue39.nonce=$env:TABLO_SERVER_CELL_NONCE",'--network=none','--read-only','--cap-drop=ALL','--security-opt=no-new-privileges','--pids-limit=8','--memory=512m','--cpus=2','--no-healthcheck','--user',"$($identity.uid):$($identity.gid)",'--mount',"type=bind,source=$compilerSource,target=/src,readonly",'--mount',"type=bind,source=$outputDirectory,target=/out",'--tmpfs','/tmp:rw,noexec,nosuid,size=64m','--workdir','/src','--entrypoint','/bin/sh','--env','COMPILER_IMAGE_DIGEST=sha256:6114a2bd4956c50e4db20f08b9377e4fc7e08417b2aa34a44ec7ff52a07996b5',$compilerImage,'tools/server-supervisor-linux-build.sh')
          $primaryFailure = $null; $cleanupFailure = $null; $compiled = $false; $cleanupKnown = $false
          try {
            $containerId = (Invoke-FiniteTool 'compiler-create' $docker $create 30).Trim()
            if ($containerId -cnotmatch '^[0-9a-f]{64}$' -or (Get-Content -LiteralPath $cidFile -Raw).Trim() -cne $containerId) { throw 'Compiler container ID unknown' }
            $owned = @(Invoke-FiniteTool 'compiler-before-start' $docker @('container','inspect',$containerId) 8 | ConvertFrom-Json)
            if ($owned.Count -ne 1 -or $owned[0].Id -cne $containerId -or $owned[0].Name -cne "/$containerName" -or $owned[0].Config.Labels.'tablo.issue39.nonce' -cne $env:TABLO_SERVER_CELL_NONCE -or $owned[0].Image -cne $image[0].Id -or $owned[0].State.Status -cne 'created') { throw 'Compiler positive ownership differs' }
            $null = Invoke-FiniteTool 'compiler-start' $docker @('start','--attach',$containerId) 180
            $finished = @(Invoke-FiniteTool 'compiler-closed' $docker @('container','inspect',$containerId) 8 | ConvertFrom-Json)
            if ($finished.Count -ne 1 -or $finished[0].Id -cne $containerId -or $finished[0].State.Running -or $finished[0].State.OOMKilled -or $finished[0].State.Dead -or $finished[0].State.Status -cne 'exited' -or $finished[0].State.ExitCode -ne 0) { throw 'Compiler native exit or closure failed' }
            $compiled = $true
          } catch { $primaryFailure = $_ }
          finally {
            try {
              if (!(Test-Path -LiteralPath $cidFile)) { throw 'Compiler resource closure unknown' }
              $cleanupId = (Get-Content -LiteralPath $cidFile -Raw).Trim()
              if ($cleanupId -cnotmatch '^[0-9a-f]{64}$') { throw 'Compiler cleanup identity unknown' }
              $owned = @(Invoke-FiniteTool 'compiler-cleanup-ownership' $docker @('container','inspect',$cleanupId) 8 | ConvertFrom-Json)
              if ($owned.Count -ne 1 -or $owned[0].Id -cne $cleanupId -or $owned[0].Name -cne "/$containerName" -or $owned[0].Config.Labels.'tablo.issue39.nonce' -cne $env:TABLO_SERVER_CELL_NONCE -or $owned[0].Image -cne $image[0].Id) { throw 'Compiler cleanup ownership refused' }
              if ($owned[0].State.Running) { $null = Invoke-FiniteTool 'compiler-cancel' $docker @('container','kill',$cleanupId) 8 }
              $closed = @(Invoke-FiniteTool 'compiler-cleanup-closed' $docker @('container','inspect',$cleanupId) 8 | ConvertFrom-Json)
              if ($closed.Count -ne 1 -or $closed[0].Id -cne $cleanupId -or $closed[0].State.Running) { throw 'Compiler daemon scope closure unknown' }
              $null = Invoke-FiniteTool 'compiler-remove' $docker @('container','rm',$cleanupId) 8
              $cleanupKnown = $true
            } catch { $cleanupFailure = $_ }
            [IO.File]::WriteAllText((Join-Path $cellDirectory 'safe-compiler.json'), (@{ compiled=$compiled; ownedCleanupClosed=$cleanupKnown; issueAccepted=$false } | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          }
          if ($null -ne $primaryFailure -or $null -ne $cleanupFailure -or !$compiled -or !$cleanupKnown) { throw 'Compiler preparation or owned cleanup failed; see private receipts' }
          $binary = Join-Path $outputDirectory 'server-supervisor-linux'
          $build = Join-Path $outputDirectory 'build.json'
          foreach ($entry in @{ TABLO_SERVER_LINUX_ADAPTER=$binary; TABLO_SERVER_LINUX_BUILD=$build }.GetEnumerator()) { [IO.File]::AppendAllText($env:GITHUB_ENV, "$($entry.Key)=$($entry.Value)`n", [Text.UTF8Encoding]::new($false)) }
          foreach ($entry in @{ TABLO_SERVER_LINUX_ADAPTER=$binary; TABLO_SERVER_LINUX_BUILD=$build }.GetEnumerator()) { $digest=(Get-FileHash -LiteralPath $entry.Value -Algorithm SHA256).Hash.ToLowerInvariant(); [IO.File]::AppendAllText($env:GITHUB_ENV, "$($entry.Key)_SHA256=$digest`n", [Text.UTF8Encoding]::new($false)) }
      - name: Prepare owned PHP inputs and qualify only execution cells
        timeout-minutes: 32
        env:
          CELL_DECLARATION_ONLY: ${{ matrix.declarationOnly }}
        run: |
          $cellDirectory = Join-Path $env:RUNNER_TEMP 'tablo-server-cell'
          $diagnosticOnly = [bool]::Parse($env:CELL_DECLARATION_ONLY)
          & $env:TABLO_TEST_NODE_BIN tools/server-qualification-diagnostic.cjs --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:TABLO_TEST_NODE_BIN --test tools/server-native-denial.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:TABLO_TEST_NODE_BIN --test tools/server-io-uring-fallback.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:TABLO_SERVER_PREPARED_PHP -n tools/server-io-uring-php-grammar.test.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preparationArguments = @("--cell=$cellDirectory", "--source=$PWD")
          if ($diagnosticOnly) { $preparationArguments += '--declaration-only' }
          & $env:TABLO_TEST_NODE_BIN tools/server-linux-prepare.cjs @preparationArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prepared = Get-Content -LiteralPath (Join-Path $cellDirectory 'prepared-inputs.json') -Raw | ConvertFrom-Json
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TABLO_SERVER_PHP_BOOTSTRAP_MODULES=$($prepared.modules.path)`nTABLO_SERVER_PHP_BOOTSTRAP_MODULES_SHA256=$($prepared.modules.sha256)`nTABLO_SERVER_PREPARED_PHP_INI=$($prepared.bootstrapIni)`nPHP_INI_SCAN_DIR=$($prepared.bootstrapIniScanDirectory)`n", [Text.UTF8Encoding]::new($false))
          if ($diagnosticOnly) { exit 0 }
          & $env:TABLO_TEST_NODE_BIN tools/server-supervisor-linux-qualify.cjs "--plan=$($prepared.qualificationPlan.path)" "--sha256=$($prepared.qualificationPlan.sha256)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qualification = $prepared.qualification.path
          $qualificationDigest = (Get-FileHash -LiteralPath $qualification -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TABLO_SERVER_LINUX_QUALIFICATION=$qualification`nTABLO_SERVER_LINUX_QUALIFICATION_SHA256=$qualificationDigest`n", [Text.UTF8Encoding]::new($false))
      - name: Declare the finite cell and execute only qualified mode
        env:
          CELL_ENGINE: ${{ matrix.engine }}
          CELL_PHP: ${{ matrix.php }}
          CELL_DECLARATION_ONLY: ${{ matrix.declarationOnly }}
        run: |
          $cellDirectory = Join-Path $env:RUNNER_TEMP 'tablo-server-cell'
          $safeDeclaration = Join-Path $cellDirectory 'safe-declaration.json'
          $declaration = Get-Content -LiteralPath $safeDeclaration -Raw | ConvertFrom-Json
          $diagnosticOnly = [bool]::Parse($env:CELL_DECLARATION_ONLY)
          $declarationPhp = $env:TABLO_SERVER_PREPARED_PHP
          $bootstrapArguments = @('-c',$env:TABLO_SERVER_PREPARED_PHP_INI)
          $declaration.stage = 'WORKFLOW_SOURCE_INVENTORY'
          [IO.File]::WriteAllText($safeDeclaration, ($declaration | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trackedPaths = Join-Path $cellDirectory 'tracked-paths.json'
          [IO.File]::WriteAllText($trackedPaths, ($files | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          $selectedPaths = & $declarationPhp @bootstrapArguments -r 'require $argv[1]; $paths = json_decode(file_get_contents($argv[2]), true, 64, JSON_THROW_ON_ERROR); echo json_encode(\Tablo\Tools\ServerFixturePlan::sourcePaths($paths), JSON_THROW_ON_ERROR);' tools/ServerFixturePlan.php $trackedPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @($selectedPaths | ConvertFrom-Json)
          $inventory = @($files | ForEach-Object { @{ path = $_; sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
          $sourceManifest = Join-Path $cellDirectory 'source.json'
          [IO.File]::WriteAllText($sourceManifest, (@{ files = $inventory } | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          $env:TABLO_TEST_SOURCE_MANIFEST = $sourceManifest
          $env:TABLO_TEST_SOURCE_MANIFEST_SHA256 = (Get-FileHash -LiteralPath $sourceManifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $declaration.stage = 'WORKFLOW_TOOL_SELECTION'
          [IO.File]::WriteAllText($safeDeclaration, ($declaration | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          $env:TABLO_TEST_OBSERVER_PORT = '46399'
          $env:LEKALO_BIN = Join-Path $PWD '.ci/lekalo-bin/lekalo'
          $version = & $env:LEKALO_BIN --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne 'lekalo 0.6.3') { throw 'Unexpected Lekalo CLI version' }
          $plan = Join-Path $cellDirectory 'cell.json'
          $arguments = @('tools/server-cell.php', "--plan=$plan", "--engine=$env:CELL_ENGINE")
          if ($diagnosticOnly) { $arguments += '--declaration-diagnostic' }
          else {
            $arguments += '--pull'
            if ($env:CELL_ENGINE -eq 'mysql' -and $env:CELL_PHP -eq '8.5') { $arguments += '--cross' }
          }
          $captureDirectory = Join-Path $cellDirectory 'private-declaration'
          New-Item -ItemType Directory -Path $captureDirectory -ErrorAction Stop | Out-Null
          chmod 700 -- $captureDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stdout = Join-Path $captureDirectory 'php.stdout'
          $stderr = Join-Path $captureDirectory 'php.stderr'
          $declaration.stage = 'PHP_NO_SAFE_RECORD'
          [IO.File]::WriteAllText($safeDeclaration, ($declaration | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          & $declarationPhp @bootstrapArguments @arguments 1> $stdout 2> $stderr
          $declarationExit = $LASTEXITCODE
          $declaration.nativeExit = $declarationExit
          if ($declarationExit -eq 0) { $declaration.status = 'declared'; $declaration.stage = 'PLAN_REPORTED' }
          else {
            try {
              $parserStderr = Join-Path $captureDirectory 'parser.stderr'
              $projection = & $declarationPhp @bootstrapArguments -r 'require "tools/server-cell.php"; $bytes = file_get_contents($argv[1], false, null, 0, 4097); echo json_encode(server_cell_declaration_record($bytes), JSON_THROW_ON_ERROR);' $stderr 2> $parserStderr
              if ($LASTEXITCODE -eq 0 -and ($projection -join "`n").Length -le 2048) {
                $record = ($projection -join "`n") | ConvertFrom-Json
                if ($null -ne $record) {
                  $declaration.status = 'failed'
                  foreach ($field in @('stage','type','source','line')) { $declaration.$field = $record.$field }
                }
              }
            } catch { $declaration.stage = 'PHP_NO_SAFE_RECORD' }
          }
          [IO.File]::WriteAllText($safeDeclaration, ($declaration | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          if ($null -eq $declarationExit) { throw 'Declaration native exit unknown.' }
          if ($declarationExit -ne 0) { exit $declarationExit }
          if ($diagnosticOnly) { exit 0 }
          $planDigest = (Get-FileHash -LiteralPath $plan -Algorithm SHA256).Hash.ToLowerInvariant()
          & $env:TABLO_TEST_NODE_BIN tools/server-supervisor.cjs "--execute=$plan" "--sha256=$planDigest"
          $observerExit = $LASTEXITCODE
          [IO.File]::WriteAllText((Join-Path $cellDirectory 'observer-exit.json'), (@{ exit = $observerExit; planSha256 = $planDigest } | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          exit $observerExit
      - name: Retain safe cell status without private credentials or raw captures
        if: always()
        run: |
          $cellDirectory = Join-Path $env:RUNNER_TEMP 'tablo-server-cell'
          if (!(Test-Path -LiteralPath $cellDirectory)) { New-Item -ItemType Directory -Path $cellDirectory -ErrorAction Stop | Out-Null }
          $status = @{ schema = 'tablo/server-hosted-summary/v1'; status = 'NOTRUN_OR_FAILED'; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; head = (git rev-parse HEAD); engine = '${{ matrix.engine }}'; php = '${{ matrix.php }}'; declarationOnly = [bool]::Parse('${{ matrix.declarationOnly }}'); issueAccepted = $false }
          $planPath = Join-Path $cellDirectory 'cell.json'
          if (Test-Path -LiteralPath $planPath) {
            $plan = Get-Content -LiteralPath $planPath -Raw | ConvertFrom-Json
            $ownerPath = Join-Path $plan.observer.root 'evidence/observer-result.json'
            $ownerExitPath = Join-Path $cellDirectory 'observer-exit.json'
            $ownerPassed = $false
            if ((Test-Path -LiteralPath $ownerPath) -and (Test-Path -LiteralPath $ownerExitPath)) {
              $owner = Get-Content -LiteralPath $ownerPath -Raw | ConvertFrom-Json
              $ownerExit = Get-Content -LiteralPath $ownerExitPath -Raw | ConvertFrom-Json
              $ownerPassed = $owner.status -eq 'passed' -and $owner.nonce -eq $plan.nonce -and $ownerExit.exit -eq 0 -and $ownerExit.planSha256 -eq (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant()
              $status.observer = @{ status = $owner.status; exit = $ownerExit.exit; sha256 = (Get-FileHash -LiteralPath $ownerPath -Algorithm SHA256).Hash.ToLowerInvariant() }
            }
            $resultPath = Join-Path $plan.runtime 'evidence/cell-result.json'
            $status.nonce = $plan.nonce
            if (Test-Path -LiteralPath $resultPath) {
              $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
              if ($ownerPassed -and $result.status -eq 'passed' -and $result.ownedServicesClosed -eq $true -and $result.nonce -eq $plan.nonce) { $status.status = 'passed' }
              $status.resultSha256 = (Get-FileHash -LiteralPath $resultPath -Algorithm SHA256).Hash.ToLowerInvariant()
              [IO.File]::WriteAllText((Join-Path $cellDirectory 'safe-native.json'), ($result.safeNative | ConvertTo-Json -Depth 40), [Text.UTF8Encoding]::new($false))
            }
            $progress = @(Get-ChildItem -LiteralPath (Join-Path $plan.runtime 'evidence') -Filter 'native-*.json' -File -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json })
            $status.nativeProgress = $progress
            $coldDiagnostic = Join-Path $plan.runtime 'evidence/cold-r77.json'
            $status.coldDiagnostic = 'missing'
            if (Test-Path -LiteralPath $coldDiagnostic) {
              try {
                & tools/collect-cold-r77.ps1 -InputPath $coldDiagnostic -OutputPath (Join-Path $cellDirectory 'safe-cold-r77.json') -RunId $env:GITHUB_RUN_ID -Head (git rev-parse HEAD) -Nonce $plan.nonce -Engine '${{ matrix.engine }}' -Php '${{ matrix.php }}'
                if (!$?) { throw 'Numeric-only cold diagnostic projection refused' }
                $status.coldDiagnostic = 'retained'
              } catch {
                # A killed actor can leave its preopened sidecar empty. Preserve the original cell evidence.
                $status.coldDiagnostic = 'invalid-or-incomplete'
              }
            }
          }
          [IO.File]::WriteAllText((Join-Path $cellDirectory 'safe-summary.json'), ($status | ConvertTo-Json -Depth 30), [Text.UTF8Encoding]::new($false))
      - name: Upload safe server-cell summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        with:
          name: server-cell-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.engine }}-php-${{ matrix.php }}${{ matrix.declarationOnly && '-declaration-only' || '' }}
          path: ${{ runner.temp }}/tablo-server-cell/safe-*.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          archive: true
          retention-days: 7
